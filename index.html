<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>개념중공업 작업지시서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 개념중공업 Phase 0 — 단일 테마(종이 문서 세계). 레이아웃: 상단 얇은 업무 바 + 가로 탭 → 아래로 실제 서류 한 장 */
:root{
  --desk:#e4e6ea;      /* 책상(배경) */
  --paper:#ffffff;     /* 서류 */
  --ink:#1b1d21;       /* 본문 */
  --muted:#646a74;     /* 보조 글자 */
  --rule:#2a2e35;      /* 표선 */
  --steel:#1f3a5f;     /* 회사 색 */
  --ok:#17663a; --ok-bg:#e3f2e8;
  --bad:#a8231b; --bad-bg:#fbe9e7;
  --pend:#7a5b00; --pend-bg:#fff4cf;
  --sheet:#1d6a46; --grid:#d5d9de; --head:#f1f3f5;
  --f-doc:"Noto Serif KR","Batang","AppleMyungjo",serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #3b82c4;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 업무 바 */
.mark{flex:none}
.loc{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.loc small{font-weight:400;opacity:.8;margin-right:6px;font-variant-numeric:tabular-nums}
.menu-btn{flex:none;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;min-height:40px;padding:0 10px;font-size:14px;border-radius:2px}
/* 안내도(메뉴) */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.45);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.dir{background:#14181f;color:#e9edf2;width:min(360px,92vw);height:100%;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 24px;font-family:var(--f-ui)}
.dir-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dir-h b{font-size:16px;letter-spacing:.04em}
.dir-close{border:1px solid #4a5260;background:none;color:#fff;min-height:40px;min-width:40px}
.today{background:#1f3a5f;border-radius:4px;padding:12px;margin-bottom:14px}
.today small{display:block;opacity:.8;font-size:12px}
.today button{margin-top:8px;width:100%;min-height:44px;background:#fff;color:#1f3a5f;border:0;font-weight:700;font-size:15px}
.floors{list-style:none;margin:0;padding:0;border-top:1px solid #2c333e}
.floor{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #2c333e}
.floor .fl{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;color:#f5c542;text-align:center;padding-top:2px}
.floor .nm{font-weight:700;font-size:15px}
.floor .ds{font-size:12px;color:#9aa4b2;margin:1px 0 6px}
.floor .rooms{display:flex;flex-wrap:wrap;gap:6px}
.room{min-height:40px;border:1px solid #4a5260;background:#1c222b;color:#fff;padding:4px 10px;font-size:13px;border-radius:2px}
.room[aria-current="true"]{border-color:#f5c542;color:#f5c542}
.floor.closed .nm,.floor.closed .ds{color:#6b7482}
.soon{font-size:11px;border:1px solid #6b7482;color:#9aa4b2;padding:1px 6px;border-radius:999px;margin-left:6px;font-weight:400}
/* 출입 게이트 */
.gate{position:fixed;inset:0;z-index:70;background:#0f141b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));font-family:var(--f-ui);overflow:hidden;transition:opacity .45s}
.gate[hidden]{display:none}
.gate.out{opacity:0;pointer-events:none}
.lobby-sign{text-align:center}
.lobby-sign .co{font-family:var(--f-doc);font-weight:900;font-size:24px;letter-spacing:.22em}
.lobby-sign small{display:block;color:#8d97a6;font-size:12px;letter-spacing:.2em;margin-top:2px}
.board{background:#05070a;border:1px solid #2c333e;width:min(340px,100%);padding:8px 12px;margin-top:14px;font-size:13px}
.board div{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed #1f252e;color:#cfd6df}
.board div:last-child{border-bottom:0}
.board .f{font-family:ui-monospace,Menlo,monospace;color:#f5c542;width:26px}
.board .x{color:#5f6875}
.reader-zone{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;position:absolute;left:0;right:0;top:calc(50% - 93px)}
.idcard{width:210px;background:#fff;color:#1b1d21;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);border:0;padding:0;text-align:left;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.idcard .band{background:#1f3a5f;color:#fff;font-size:11px;font-weight:700;padding:6px 10px;letter-spacing:.1em;display:flex;justify-content:space-between}
.idcard .body{display:flex;gap:10px;padding:10px}
.idcard .ph{width:54px;height:66px;background:#dfe4ea;flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.idcard .nm{font-weight:700;font-size:17px}
.idcard .rk{font-size:12px;color:#4b5563}
.idcard .no{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6b7280;margin-top:6px}
.idcard.tagged{transform:translateY(14px) scale(.94)}
.reader{width:150px;height:58px;background:#222a35;border:1px solid #3a4452;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:#9aa4b2}
.led{width:12px;height:12px;border-radius:50%;background:#c0392b;box-shadow:0 0 10px #c0392b}
.reader.ok .led{background:#2ecc71;box-shadow:0 0 14px #2ecc71}
.gate-msg{min-height:68px;text-align:center;font-size:15px;line-height:1.5}
.gate-msg b{font-size:18px}
.gate-msg .sub{color:#9aa4b2;font-size:13px}
.lift{font-family:ui-monospace,Menlo,monospace;font-size:34px;color:#f5c542;letter-spacing:.1em}
.gate-hint{color:#6b7482;font-size:12px}
@media (prefers-reduced-motion:reduce){.idcard,.gate{transition:none}}

.bar{position:sticky;top:0;z-index:20;background:var(--steel);color:#fff;padding:env(safe-area-inset-top) 0 0}
.bar-in{display:flex;align-items:center;gap:10px;padding:8px 16px;max-width:820px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.logo svg{flex:none}
.who{margin-left:auto;font-size:13px;opacity:.92;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:820px;margin:0 auto;padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:#cdd8e6;padding:9px 12px 10px;font-size:14px;border-bottom:3px solid transparent;min-height:44px}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff;font-weight:700}

main{max-width:820px;margin:0 auto;padding:14px 10px calc(40px + env(safe-area-inset-bottom))}
.notice{font-size:13px;color:var(--muted);margin:0 6px 10px}
.banner{background:#fff;border-left:4px solid var(--pend);padding:8px 12px;font-size:14px;margin:0 0 10px}

/* ── 작업지시서(공문 서식) ── */
.paper{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);padding:22px 18px 26px;font-family:var(--f-doc)}
.org{text-align:center;font-weight:900;font-size:22px;letter-spacing:.06em;margin:2px 0 2px}
.org-sub{text-align:center;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-bottom:12px}
.hr2{border:0;border-top:2px solid var(--rule);margin:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 2px;font-size:15px}
.meta dt{font-weight:700}
.meta dd{margin:0}
.appoint{border:1px solid var(--rule);padding:10px 12px;margin:12px 0 4px;font-size:15px}
.appoint b{display:block;font-size:13px;font-family:var(--f-ui);letter-spacing:.08em;color:var(--steel);margin-bottom:2px}
.lead{font-size:15px;margin:12px 2px 10px}
table.qt{width:100%;border-collapse:collapse;font-size:16px;table-layout:fixed}
.qt th,.qt td{border:1px solid var(--rule);padding:6px 5px;vertical-align:middle}
.qt th{background:#f3f4f6;font-family:var(--f-ui);font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:-.03em;padding:6px 2px}
.qt col.c-no{width:34px}.qt col.c-ans{width:118px}.qt col.c-res{width:62px}
.qt td.no{text-align:center;font-variant-numeric:tabular-nums;font-family:var(--f-ui);font-size:14px}
.qt td.q{font-size:17px;word-break:keep-all}
.qt .kind{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted);letter-spacing:.04em}
.qt tr.cur td{background:#fffbea}
.qt tr.done td{color:#4b5059}
.ans{display:flex;gap:4px;align-items:stretch}
.ans input{flex:1;min-width:0}
.ans .btn-s{flex:none;width:44px;min-height:44px;padding:0}
.ans .btn-s.wide{width:100%}
.ans input{width:100%;min-height:44px;border:1.5px solid #8b9099;border-radius:2px;padding:6px 8px;font-size:17px;font-family:var(--f-ui);background:#fff;font-variant-numeric:tabular-nums}
.ans input:disabled{background:#f6f7f8;border-color:#c9cdd3;color:var(--ink)}
.btn-s{min-height:36px;border:1px solid var(--rule);background:#fff;font-family:var(--f-ui);font-size:13px;border-radius:2px;padding:2px 6px}
.btn-s:active{background:#eceef1}
.res{text-align:center;font-family:var(--f-ui);font-size:13px;font-weight:700}
.st{display:inline-block;padding:2px 6px;border-radius:2px;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg)} .st.bad{color:var(--bad);background:var(--bad-bg)} .st.pend{color:var(--pend);background:var(--pend-bg)}
.st.ok::before{content:"○ "} .st.bad::before{content:"✕ "} .st.pend::before{content:"… "}
tr.note td{font-family:var(--f-ui);font-size:14px;background:#fafafa;padding:8px 10px}
.note-h{font-weight:700;margin-right:6px}
.concept{display:block;margin:6px 0 4px;padding:7px 9px;border-left:3px solid #2f6db5;background:#eef4fb;font-size:13px;line-height:1.55;color:#22303f}
.concept-h{display:block;font-size:11.5px;font-weight:700;color:#5a6b7d;letter-spacing:.02em;margin-bottom:3px}
.concept b{display:block;font-size:13px;color:#1f4f86;margin-top:5px}
.concept-b{display:block}
.concept-ex{display:block;margin-top:3px;padding:3px 7px;background:#fff;border:1px solid #d6e2ef;border-radius:3px;font-size:12.5px;color:#334}
details.deep{margin-top:3px;font-size:12px;color:#556}
details.deep summary{cursor:pointer;color:#5a7ca3;list-style:none}
details.deep summary::-webkit-details-marker{display:none}
.sol-btn{margin:2px 10px 0 0}
.sol-body{margin-top:6px;padding-top:6px;border-top:1px dashed #ccc}
details.sol{margin-top:4px;font-size:12.5px;color:#444}
details.sol summary{cursor:pointer;color:#2f6db5;font-weight:600;list-style:none}
details.sol summary::-webkit-details-marker{display:none}
details.sol[open] summary{margin-bottom:3px}
.note .ext{display:block;color:var(--muted);margin-top:4px}
.linkbtn{border:0;background:none;color:var(--steel);text-decoration:underline;padding:6px 0;font-size:13px;min-height:32px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.choice{min-height:44px;border:1px solid #9aa0a8;background:#fff;border-radius:2px;padding:4px 6px;font-size:15px;word-break:keep-all;font-family:var(--f-ui);text-align:left}
.choice[aria-pressed="true"]{border:2px solid var(--steel);background:#eef3f9;font-weight:700}
.choice:disabled{cursor:default}
.sign{display:flex;justify-content:flex-end;margin-top:16px}
.appr{border-collapse:collapse;font-family:var(--f-ui);font-size:12px;text-align:center}
.appr th,.appr td{border:1px solid var(--rule);width:64px}
.appr th{background:#f3f4f6;padding:3px}
.appr td{height:46px}
.stamp{display:inline-block;border:2px solid #c0392b;color:#c0392b;border-radius:50%;width:38px;height:38px;line-height:34px;font-size:11px;font-weight:700;transform:rotate(-8deg)}
.foot{margin-top:18px;font-size:14px}
.foot .issuer{text-align:center;font-weight:900;font-size:17px;margin:18px 0 4px;letter-spacing:.02em;white-space:nowrap}
.seal{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:-14px;border:2px solid #c0392b;color:#c0392b;font-size:11px;line-height:1.15;width:40px;height:40px;font-family:var(--f-ui);font-weight:700;letter-spacing:0;opacity:.85;transform:rotate(-4deg);background:rgba(255,255,255,.2)}
.res .linkbtn{display:block;margin:2px auto 0;font-weight:400}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;font-family:var(--f-ui)}
.btn{min-height:46px;padding:8px 16px;border:1px solid var(--rule);background:#fff;border-radius:2px;font-size:15px;font-weight:500}
.btn.primary{background:var(--steel);color:#fff;border-color:var(--steel);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:8px}

/* 결과 보고 */
.report{margin-top:18px;border:2px solid var(--rule);padding:14px;font-family:var(--f-ui)}
.report h3{margin:0 0 8px;font-family:var(--f-doc);font-size:18px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.kv div{border:1px solid var(--grid);padding:8px;text-align:center}
.kv b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}

/* ── 시트 뷰 ── */
.sheet{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);font-family:var(--f-ui)}
.ribbon{background:var(--sheet);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
.ribbon .fname{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ribbon .menu{display:flex;gap:12px;opacity:.85;margin-left:auto;font-size:12px;white-space:nowrap}
.fx{display:flex;align-items:center;border-bottom:1px solid var(--grid);font-size:14px}
.fx .addr{width:58px;padding:6px 8px;border-right:1px solid var(--grid);font-family:ui-monospace,Menlo,monospace;color:#333;text-align:center}
.fx .fxi{padding:0 8px;color:var(--muted);font-style:italic;border-right:1px solid var(--grid)}
.fx .val{padding:6px 8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:340px;table-layout:fixed;font-size:15px}
.grid th,.grid td{border:1px solid var(--grid);padding:6px}
.grid thead th{background:var(--head);font-weight:500;font-size:12px;color:#555;padding:3px}
.grid th.rn{background:var(--head);width:30px;font-weight:500;font-size:12px;color:#555;text-align:center}
.grid col.c-a{width:34px}.grid col.c-c{width:104px}.grid col.c-d{width:62px}
.grid tr.hdr td{background:#eaf3ee;font-weight:700;font-size:12px;letter-spacing:-.03em}
.grid td.sel{outline:2px solid var(--sheet);outline-offset:-2px}
.grid td.okc{background:#dff0e5}
.grid td.badc{background:#fbe3e0}
.grid .ans input{border:1px solid #b9bec5;border-radius:0;min-height:44px}
.sheet-tabs{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--grid);background:var(--head);font-size:13px;scrollbar-width:none}
.sheet-tabs span{flex:none;padding:8px 12px;border-right:1px solid var(--grid);color:#555}
.sheet-tabs span.on{background:#fff;color:var(--sheet);font-weight:700;border-bottom:3px solid var(--sheet)}
.statusbar{display:flex;justify-content:space-between;padding:5px 10px;background:var(--sheet);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.sheet .inner{padding:0 12px 14px}

/* 일반 패널 */
.panel{background:#fff;padding:18px 16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel h2{font-family:var(--f-doc);font-size:20px;margin:0 0 4px;text-wrap:balance}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.item{border:1px solid var(--grid);padding:10px 12px;display:flex;gap:10px;align-items:center}
.item .t{flex:1;min-width:0}
.item .t small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:12px;padding:2px 8px;border:1px solid currentColor;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.pend{color:var(--pend)}.pill.none{color:var(--muted)}
table.plain{width:100%;border-collapse:collapse;font-size:15px}
.plain th,.plain td{border-bottom:1px solid var(--grid);padding:9px 6px;text-align:left}
.plain th{font-size:12px;color:var(--muted);font-weight:500}
.plain tr.me td{background:#eef3f9;font-weight:700}
.meter{height:10px;background:#e9ecef;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--steel)}
.num{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:120px;border:1px solid #9aa0a8;padding:8px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

/* 은행 */
.bank{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bank .acct{background:linear-gradient(135deg,#1f3a5f,#2f5a8a);color:#fff;border-radius:14px;padding:18px}
.bank .acct small{opacity:.8}
.bank .bal{font-size:30px;font-weight:700;margin:6px 0;font-variant-numeric:tabular-nums}
.tag-virtual{display:inline-block;font-size:11px;border:1px solid rgba(255,255,255,.7);border-radius:4px;padding:1px 6px;margin-left:6px}

/* 대화상자 */
.dlg-back{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:#fff;max-width:380px;width:100%;padding:18px;border-top:4px solid var(--bad)}
.dlg h3{margin:0 0 6px;font-family:var(--f-doc)}
.dlg p{margin:0 0 14px;font-size:14px;color:#333}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1d21;color:#fff;padding:10px 16px;font-size:14px;z-index:60;max-width:90vw}

@media (min-width:640px){
  .paper{padding:36px 40px 40px}
  .qt col.c-ans{width:150px}.qt col.c-res{width:80px}
  .grid col.c-c{width:140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* 엘리베이터 (홈) */
.lift-wrap{min-height:100%;background:#1a1f27;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));font-family:var(--f-ui);color:#e9edf2}
.lift-top{width:min(360px,100%);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8d97a6;letter-spacing:.08em}
.lcd{width:min(360px,100%);margin:10px 0 16px;background:#060807;border:2px solid #333b46;border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.lcd .fl{font-family:ui-monospace,Menlo,monospace;font-size:38px;color:#ff9f1c;letter-spacing:.06em;text-shadow:0 0 8px rgba(255,159,28,.6)}
.lcd .msg{font-size:13px;color:#ffcf8a;text-align:right;max-width:60%}
.panel-steel{width:min(360px,100%);background:linear-gradient(180deg,#c9ced6,#a9b0ba 50%,#c3c9d1);border-radius:10px;padding:16px 14px;box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(0,0,0,.45);color:#1b1d21;display:grid;gap:10px}
.fbtn{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:2px 4px;min-height:64px;border-radius:8px}
.fbtn:focus-visible{outline:3px solid #1f3a5f}
.fbtn .knob{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f4f6f8,#b7bec8 70%);border:3px solid #7d8692;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:18px;color:#2a2f37;box-shadow:0 2px 3px rgba(0,0,0,.25)}
.fbtn .lb b{display:block;font-size:20px;letter-spacing:-.01em}
.fbtn .lb small{display:block;font-size:13px;color:#3f4652}
.fbtn .go{font-size:12px;font-weight:700;color:#1f3a5f;background:rgba(255,255,255,.55);padding:3px 8px;border-radius:999px;white-space:nowrap}
.fbtn.lit .knob{border-color:#ff9f1c;box-shadow:0 0 0 3px rgba(255,159,28,.45),0 0 16px rgba(255,159,28,.7);color:#b25d00}
.fbtn.minor{min-height:48px}
.fbtn.minor .knob{width:44px;height:44px;font-size:14px;margin-left:7px}
.fbtn.minor .lb b{font-size:15px}
.fbtn:disabled{opacity:.45;cursor:default}
.panel-steel hr{border:0;border-top:1px solid rgba(0,0,0,.18);margin:2px 0}
.lift-foot{margin-top:14px;font-size:12px;color:#6b7482;text-align:center}
.doors{position:fixed;inset:0;z-index:65;pointer-events:none;display:flex}
.doors i{flex:1;background:linear-gradient(90deg,#8e96a1,#c3c9d1 50%,#8e96a1);transform:scaleX(0);transition:transform .32s ease-in}
.doors i:first-child{transform-origin:left}.doors i:last-child{transform-origin:right}
.doors.shut i{transform:scaleX(1)}

/* 상단 바 (층 안) */
.back-lift{flex:none;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;min-height:40px;padding:0 10px;font-size:14px;border-radius:2px}
.bar-in .loc{flex:1}
.floor-foot{display:flex;justify-content:center;gap:16px;margin:16px 0 0;font-size:14px}

/* 배치 결과 */
.place-tbl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.place-tbl td{border-bottom:1px solid var(--grid);padding:7px 4px}
.place-tbl tr.start td{background:#fff4cf;font-weight:700}

/* 마이페이지 */
.my{display:grid;gap:12px}
.my .idc{display:flex;gap:12px;align-items:center}
.my .idc .ph{width:52px;height:64px;background:#dfe4ea;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
details.sec{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
details.sec summary{padding:14px 16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:48px;align-items:center}
details.sec summary span{font-weight:400;color:var(--muted);font-size:14px}
details.sec .in{padding:0 16px 16px}

main.full{max-width:none;padding:0;min-height:100%;display:flex;flex-direction:column}
main.full .lift-wrap{flex:1}
/* 통지서 모달 */
.ntc{background:#fff;max-width:380px;width:100%;max-height:92vh;overflow-y:auto;padding:22px 18px 18px;border-top:6px solid var(--steel);font-family:var(--f-ui)}
.nt-h{font-family:var(--f-doc);font-weight:900;font-size:21px;text-align:center;letter-spacing:.12em;border-bottom:2px solid var(--rule);padding-bottom:10px}
.nt-to{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 12px}
.nt-rank{border:2px solid var(--rule);text-align:center;padding:12px 8px;margin-bottom:8px}
.nt-rank small{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em}
.nt-rank b{display:block;font-family:var(--f-doc);font-size:34px;font-weight:900;color:var(--steel);margin:2px 0}
.nt-rank span{font-size:14px}
.nt-meta{text-align:center;font-size:13px;color:var(--muted);margin:0 0 14px}
.pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pick-grid .btn{display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:6px}
.pick-grid .btn small{font-size:12px;color:var(--muted)}

/* ── 건물 단면도 (홈) ── */
.bldg{min-height:100%;background:linear-gradient(#9fc3e6 0,#cfe2f3 340px,#e8eef4 100%);padding:calc(14px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom));font-family:var(--f-ui)}
.bldg-top{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto;padding:0 16px 6px;font-size:12px;color:#2c3e55}
.roof{max-width:520px;margin:0 auto;padding:0 12px;display:flex;flex-direction:column;align-items:center}
.roof .ant{width:2px;height:22px;background:#4a5563}
.roof .signboard{background:#1f3a5f;color:#fff;font-family:var(--f-doc);font-weight:900;letter-spacing:.3em;font-size:18px;padding:6px 18px 6px 24px;border:2px solid #0f2340}
.roof .parapet{width:100%;height:12px;background:#59626f;margin-top:6px}
.tower{position:relative;max-width:520px;margin:0 auto;padding:0 12px}
.tower-in{position:relative;background:#59626f;padding:0 8px 0 50px}
.shaft{position:absolute;left:8px;top:0;bottom:0;width:34px;background:#2b313a;border-right:2px solid #1b1f25}
.shaft::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:#454d59}
.car{position:absolute;left:3px;width:28px;height:var(--fh);background:linear-gradient(#d8dde3,#aab2bd);border:2px solid #1b1f25;border-radius:2px;transition:top .25s linear;display:flex;align-items:flex-end;justify-content:center}
.car::after{content:"";width:12px;height:22px;margin-bottom:6px;border-radius:6px 6px 2px 2px;background:#3d4654}
.flr{--fh:118px;display:block;width:100%;height:var(--fh);border:0;padding:0;margin:0;position:relative;background:#30363f;border-bottom:8px solid #59626f;text-align:left;overflow:hidden;color:#fff;cursor:pointer}
.flr:disabled{cursor:default}
.flr svg.scene{position:absolute;inset:0;width:100%;height:100%}
.flr .tag{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:8px}
.flr .no{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:15px;background:#0f141b;color:#f5c542;padding:2px 6px;border-radius:2px}
.flr .nm{background:rgba(255,255,255,.92);color:#1b1d21;padding:3px 8px;border-radius:2px;font-weight:700;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.flr .nm small{font-weight:400;color:#4b5563;margin-left:6px;font-size:12px}
.flr .chip{position:absolute;right:10px;top:8px;background:#1f3a5f;color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;font-weight:700}
.flr .chip.alert{background:#a8231b}
.flr .chip.money{background:#17663a}
.flr.closed .nm{background:rgba(255,255,255,.55);color:#2b2f36}
.flr.here{box-shadow:inset 0 0 0 3px #f5c542}
.flr:focus-visible{outline:3px solid #f5c542;outline-offset:-3px}
.ground{max-width:520px;margin:0 auto;padding:0 12px}
.ground .street{height:16px;background:#3b4048}
.ground .walk{height:10px;background:#a8adb5}
.flrbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,24,31,.96);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.flrbar::-webkit-scrollbar{display:none}
.fb{flex:none;min-width:56px;min-height:52px;border-radius:26px;border:2px solid #6b7482;background:radial-gradient(circle at 40% 35%,#eef1f4,#b7bec8 75%);color:#1b1d21;font-weight:700;font-size:14px;line-height:1.1;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fb small{font-size:11px;font-weight:500;color:#39414c}
.fb:disabled{opacity:.35}
.fb.lit{border-color:#ff9f1c;box-shadow:0 0 0 3px rgba(255,159,28,.45)}

/* 특근 게시판 */
.offers{display:grid;gap:8px}
.offer{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--grid);border-left:5px solid var(--steel);padding:10px 12px;background:#fff;text-align:left;width:100%;min-height:64px}
.offer .ty{font-weight:700;font-size:15px}
.offer .ds{grid-column:1;font-size:13px;color:var(--muted)}
.offer .pr{grid-row:1/3;grid-column:2;text-align:right;font-weight:700;font-size:18px;color:var(--ok);font-variant-numeric:tabular-nums}
.offer .pr small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.offer.night{border-left-color:#3b3f8f}.offer.holiday{border-left-color:#a8231b}.offer.trip{border-left-color:#17663a}.offer.bonus{border-left-color:#c28a00}

/* 은행 앱 */
.bankapp{background:#f4f6f9;min-height:100%;font-family:var(--f-ui)}
.bk-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bk-acct{font-size:13px;color:#555}
.bk-bal{font-size:32px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bk-virtual{display:inline-block;font-size:11px;border:1px solid #9aa0a8;color:#555;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eef0f3}
.tx:last-child{border-bottom:0}
.tx .l b{display:block;font-size:15px;font-weight:500}
.tx .l small{color:#7a808a;font-size:12px}
.tx .amt{font-weight:700;color:#1d5fd0;white-space:nowrap;font-variant-numeric:tabular-nums}
.bk-h{font-size:15px;font-weight:700;margin:18px 4px 6px}

/* ── 공문서 양식 ── */
.gd{background:#fff;color:#111;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:22px 16px 26px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);font-size:15px;line-height:1.6}
.gd-head{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;margin-bottom:14px}
.gd-logo{width:44px;height:44px}
.gd-org{text-align:center;font-size:25px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.gd-slogan{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap}
.gd-slogan span:first-child{color:#1f3a5f}.gd-slogan span:last-child{color:#e67e22}
.gd-meta{display:grid;grid-template-columns:56px 1fr;margin:0;padding:0 0 6px;border-bottom:1px solid #222}
.gd-meta dt,.gd-meta dd{margin:0;padding:1px 0}
.gd-body{margin:12px 0 8px;padding-left:20px}
.gd-body li{padding-left:2px;margin:2px 0}
.gd-sub p{margin:2px 0 0 4px}
.gd-tablewrap{margin:8px 0 10px 0}
.gd-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14.5px}
.gd-t th,.gd-t td{border:1px solid #333;padding:7px 5px;vertical-align:middle}
.gd-t th{font-weight:500;background:#fff;white-space:nowrap}
.gd-t td.c{text-align:center}
.gd-t th.w-no{width:40px}.gd-t th.w-g{width:92px}.gd-t th.w-a{width:112px}.gd-t th.w-r{width:66px}
.gd-t .gd-q{word-break:keep-all;font-variant-numeric:tabular-nums}
.gd-t tr.cur .gd-ans .ans input{background:#fffbe8;border:1.5px solid #333}
.gd-reply{font-variant-numeric:tabular-nums}
/* 칼퇴파인 (과학) */
.wo.sc{border-top:0;background:#f3f5f8;padding:0 0 14px;font-size:14.5px}
.sc-top{display:flex;align-items:center;gap:10px;background:#3d4f63;color:#fff;padding:9px 12px;font-size:13px}
.sc-logo{font-weight:700;letter-spacing:.5px;font-size:15px}.sc-logo b{color:#4fd1c5;margin-left:1px}
.sc-org{flex:1;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc-user{opacity:.9;white-space:nowrap}
.sc-menu{display:flex;gap:2px;overflow-x:auto;background:#e4e9ef;border-bottom:2px solid #12a3a3;padding:0 6px}
.sc-menu span{padding:7px 10px;font-size:13px;color:#4a5a6b;white-space:nowrap}
.sc-menu span.on{background:#f3f5f8;color:#0b7f7f;font-weight:700;border:1px solid #cfd8e1;border-bottom:0;margin-top:3px}
.sc-crumb{padding:7px 12px;font-size:12px;color:#6b7a8a}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:2px 12px 8px}
.sc-head h2{margin:2px 0 0;font-size:19px;color:#2b3b4d;border-left:4px solid #12a3a3;padding-left:8px}
.wo.sc .wo-info,.wo.sc .sc-notes,.wo.sc .gd-tablewrap{margin-left:12px;margin-right:12px;width:auto}
.wo.sc .wo-info{width:calc(100% - 24px);background:#fff}.wo.sc .wo-info th{background:#e9eef3;color:#34495e}
.sc-notes{margin:8px 12px 0;padding-left:20px;font-size:13px;color:#4a5a6b}
.sc-secbar{margin:12px 12px 0;padding:6px 10px;background:#3d4f63;color:#fff;font-size:13px}
.sc-t{background:#fff;border-color:#9fb0c2}.sc-t th{background:#e9eef3;color:#34495e}.sc-t th,.sc-t td{border-color:#b9c6d3}
tr.sc-sec td{background:#e8f6f6;color:#0b7f7f;font-weight:700;font-size:12.5px;text-align:left;padding:5px 8px;border-color:#b9c6d3}
.wo.sc .gd-actions,.wo.sc .actions{margin:12px 12px 0}
.wo.sc .btn.primary{background:#0b8f8f;border-color:#0b8f8f;color:#fff}
.wo.sc .wo-foot{margin:12px 12px 0;color:#6b7a8a}
.wo.sc .report{margin:12px}
.report.sc-rep{border:2px solid #12a3a3;background:#fff}.report.sc-rep h3{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#2b3b4d}

.sim{margin:8px 0 4px;border:1px solid #9fb0c2;background:#f7fafc;padding:6px 8px 8px;max-width:300px}
.sim-h{font-size:11.5px;color:#0b7f7f;font-weight:700;margin-bottom:4px}
.sim-lab{display:block;font-size:13px;color:#34495e}.sim-lab input{display:block;width:100%;margin:6px 0 2px;accent-color:#0b8f8f}
.sim svg{width:100%;height:auto;display:block;background:#fff;border:1px solid #d5dee7;margin-top:4px}
.sim-read{margin-top:4px;font-size:14px;font-weight:700;color:#34495e;text-align:center}.sim-read.ok{color:#0b7f7f}
.sim-eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin-top:4px}.sim-eq em{font-style:normal;color:#5b6f84;padding:0 2px}
.sim-sp{display:inline-flex;align-items:center;gap:2px;border:1px solid #b9c6d3;background:#fff;padding:2px 3px}
.sim-sp button{width:30px;height:30px;border:1px solid #9fb0c2;background:#eef3f7;font-size:16px;line-height:1;padding:0;color:#34495e}
.sim-sp b{min-width:16px;text-align:center;font-size:15px}.sim-sp i{font-style:normal;font-size:15px;margin-left:2px}
.sim-cnt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12.5px}.sim-cnt .eq{color:#0b7f7f}.sim-cnt .ne{color:#c0392b;font-weight:700}
.sc-judge{font-size:13px;font-weight:700;padding:3px 9px;border:2px solid;border-radius:3px;transform:rotate(-3deg);white-space:nowrap}
.sc-judge.ok{color:#0b7f7f;border-color:#0b7f7f}.sc-judge.bad{color:#c0392b;border-color:#c0392b}
.wo.sc tr.cur .ans input{background:#e8f6f6;border:1.5px solid #12a3a3}
.wo.sc .wo-res.ok{color:#0b7f7f;font-weight:700}.wo.sc .wo-res.bad{color:#c0392b;font-weight:700}

.ch-ans{margin-top:6px;max-width:220px}.ch-ans .gd-reply{font-weight:700}
@media (max-width:560px){.gd-t .choices{grid-template-columns:1fr}}
.gd-res.ok{color:#111}.gd-res.bad{color:#a8231b;font-weight:700}.gd-res.pend{color:#555}
.gd-g-m{display:none}.gd-g-m:empty{display:none!important}
.gd .ans input{border:1px solid #666;border-radius:0;min-height:40px;font-size:16px;text-align:center}
.gd .ans .btn-s{border-radius:0;min-height:40px;width:40px;font-size:12px}
.gd tr.note td{background:#fafafa;font-size:13.5px}
.gd-end{margin:6px 0 14px 22px}
.gd-actions,.gd .actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px 20px}
.gd .btn{border-radius:0;border:1px solid #222;background:#fff;font-weight:400;min-height:44px}
.gd .btn.primary{background:#fff;color:#111;border:1px solid #222;font-weight:700}
.gd .btn:disabled{opacity:.4}
.gd .hint{margin-left:20px}
.gd .report{margin:12px 0 4px;border:1px solid #333}
.gd-issuer{text-align:center;font-size:22px;font-weight:700;letter-spacing:.05em;margin:26px 0 10px;white-space:nowrap}
.gd-seal{display:inline-flex;align-items:center;justify-content:center;text-align:center;width:46px;height:46px;border:2px solid #d9534f;color:#d9534f;font-size:9.5px;line-height:1.1;font-weight:700;letter-spacing:0;vertical-align:middle;margin-left:-10px;transform:translateY(-14px) rotate(-2deg);opacity:.85}
.gd-rcv{margin:0 0 8px;font-size:14px}.gd-rcv b{font-weight:400;margin-right:10px}
.gd-bar{height:7px;background:#bdbdbd;margin:4px 0 10px}
.gd-sign{font-size:13.5px}
.gd-sign p{margin:3px 0}
.gd-jg{text-align:right;min-height:38px;line-height:1.4;padding-right:4px}
.gd-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.gd-line b{font-size:15px}
@media (max-width:560px){
  .gd{padding:18px 12px 22px;font-size:14.5px}
  .gd-org{font-size:20px;letter-spacing:.03em}
  .gd-col-g{display:none}
  .gd-g-m{display:block;font-size:11.5px;color:#666;margin-top:2px}
  .gd-t th.w-a{width:92px}.gd-t th.w-r{width:54px}.gd-t th.w-no{width:30px}
  .gd .ans .btn-s{width:34px}.gd-t th,.gd-t td{padding:6px 3px}.gd-t{font-size:14px}
  .gd-issuer{font-size:17px}
  .gd-sign{font-size:12.5px}
}

/* ── 사내 작업지시서 (전자결재) ── */
.wo{background:#fff;color:#111;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:14px 14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);font-size:14.5px;line-height:1.5;border-top:5px solid #1f3a5f}
.wo-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#555;border-bottom:1px solid #c9ced6;padding-bottom:6px}
.wo-co{display:flex;align-items:center;gap:6px;font-weight:700;color:#1f3a5f;font-size:14px}.wo-co svg{width:22px;height:22px}
.wo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 10px}
.wo-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.wo-appr{border-collapse:collapse;font-size:11.5px;text-align:center;flex:none}
.wo-appr th,.wo-appr td{border:1px solid #444;padding:2px 4px;min-width:44px}
.wo-appr th{background:#eef1f5;font-weight:500}.wo-appr th.v{min-width:18px;width:18px;line-height:1.2}
.wo-appr td{height:42px}
.wo-appr .stamp{width:36px;height:36px;line-height:32px;font-size:10px}
.wo-info{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.wo-info th,.wo-info td{border:1px solid #666;padding:5px 6px;text-align:left;vertical-align:middle}
.wo-info th{background:#eef1f5;font-weight:500;width:72px;white-space:nowrap}
.wo-sec{margin:12px 0 4px;background:#1f3a5f;color:#fff;font-size:13px;font-weight:700;padding:3px 8px;letter-spacing:.1em}

/* 채점 (순수 함수) */
const SINO = {"영":0,"공":0,"일":1,"이":2,"삼":3,"사":4,"오":5,"육":6,"륙":6,"칠":7,"팔":8,"구":9};
const NATIVE_ONES = {"하나":1,"한":1,"둘":2,"두":2,"셋":3,"세":3,"넷":4,"네":4,"다섯":5,"여섯":6,"일곱":7,"여덟":8,"아홉":9};
const NATIVE_TENS = {"열":10,"스물":20,"스무":20,"서른":30,"마흔":40,"쉰":50,"예순":60,"일흔":70,"여든":80,"아흔":90};
function parseSino(s){
  if(!/^[영공일이삼사오육륙칠팔구십백]+$/.test(s)) return null;
  if(s==="영"||s==="공") return 0;
  let total=0, cur=0;
  for(const ch of s){
    if(ch==="백"){ total += (cur||1)*100; cur=0; }
    else if(ch==="십"){ total += (cur||1)*10; cur=0; }
    else if(ch in SINO){ if(cur) return null; cur=SINO[ch]; }
  }
  return total+cur;
}
function parseNative(s){
  for(const [w,v] of Object.entries(NATIVE_TENS)){
    if(s===w) return v;
    if(s.startsWith(w)){ const r=s.slice(w.length); if(r in NATIVE_ONES) return v+NATIVE_ONES[r]; }
  }
  return (s in NATIVE_ONES) ? NATIVE_ONES[s] : null;
}
function parseNumberAnswer(raw){
  let s=String(raw||"").replace(/\s+/g,"").replace(/[−–—]/g,"-").replace(/[,!]+$/,"").replace(/\.$/,"").replace(/(\d),(?=\d{3}(\D|$))/g,"$1");
  s=s.replace(/^[a-zA-Z]=/,"");
  s=s.replace(/(개|명|번|살|점|원|가지|센티미터|cm³|㎤|cm²|㎠|cm|CM|㎝|m)$/,"");
  if(/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  return parseSino(s) ?? parseNative(s);
}
function normText(raw){ return String(raw||"").replace(/[\s.,!'"‘’“”]/g,"").replace(/[−–—]/g,"-"); }
function grade(q, resp){
  if(q.t==="num"){ const n=parseNumberAnswer(resp); return n!==null && Math.abs(n-q.a)<1e-9; }
  if(q.t==="choice"){ return Number(resp)===q.a; }
  if(q.t==="text"){ const r=normText(resp); return q.a.some(x=>normText(x)===r); }
  return false;
}
function fmtNum(n){ return n<0 ? "−"+Math.abs(n) : String(n); }
function answerLabel(q){
  if(q.t==="choice") return "①②③④⑤"[q.a]+" "+q.c[q.a];
  if(q.t==="num") return fmtNum(q.a);
  return q.a[0];
}
function respLabel(q, r){ return q.t==="choice" ? ("①②③④⑤"[r]||"")+" "+(q.c[r]??"") : String(r); }

/* 같은 유형이 연달아 나오지 않게: 문서·검사마다 쓴 유형을 기억하고 안 쓴 유형부터 */
function mathItem(L,r,think,used){
  const g=MATH_GEN[L], list=think?g.think:g.norm, tag=(think?"t":"n")+L+":";
  let idx=list.map((_,i)=>i).filter(i=>!(used&&used.has(tag+i)));
  if(!idx.length){ if(used) [...used].filter(k=>k.startsWith(tag)).forEach(k=>used.delete(k)); idx=list.map((_,i)=>i); }
  const pickI=idx[Math.floor(r()*idx.length)]; used&&used.add(tag+pickI);
  const q=list[pickI](r); q.gk=tag+pickI; return q;
}

  r=>{ const {ri,pick}=mk(r); let m,n,a,b,ch; do{ m=ri(2,5); n=ri(2,5); [a,b]=pick([[10,5],[5,10],[20,10],[10,20]]); ch=a*m-b*n; }while(!ch); return TQ(3,1,"연립방정식 (가감법)",`작년 학생 수는 남녀 합쳐 ${100*(m+n)}명이었습니다. 올해는 남학생이 ${a}% 늘고 여학생이 ${b}% 줄어 전체가 ${Math.abs(ch)}명 ${ch>0?"늘었습니다":"줄었습니다"}. 작년 남학생은 몇 명?`,100*m,"작년 남학생을 x, 여학생을 y로 놓습니다. 식 하나는 작년 합계, 다른 하나는 ‘늘어난 수 − 줄어든 수 = 전체 변화’입니다.",`x + y = ${100*(m+n)}, ${a/100}x − ${b/100}y = ${N(ch)} → x = ${100*m}.`,{cn2:"백분율"}); },

  r=>{ const {pick}=mk(r); const n=pick([3,4,5]),mode=pick(["짝수","자연수"]); let cnt=0; for(let a=1;a<=n;a++) for(let b=0;b<=n;b++) for(let c=0;c<=n;c++) if(a!==b&&b!==c&&a!==c&&(mode==="자연수"||c%2===0)) cnt++; return TQ(3,4,"곱의 법칙",`0부터 ${n}까지의 숫자가 하나씩 적힌 카드 ${n+1}장 중에서 3장을 뽑아 만들 수 있는 세 자리 ${mode}의 개수`,cnt,mode==="짝수"?"백의 자리에는 0이 올 수 없습니다. 일의 자리가 0인 경우와 0이 아닌 짝수인 경우로 나누어 세세요.":"백의 자리에는 0이 올 수 없습니다. 백 → 십 → 일의 자리 순서로 고를 수 있는 가짓수를 곱합니다.",mode==="짝수"?`일의 자리가 0인 경우와 0이 아닌 짝수인 경우를 따로 세어 더하면 ${cnt}개.`:`${n} × ${n} × ${n-1} = ${cnt}개.`); }
 ],
 /* 6 중3 */ [
  r=>{ const {ri}=mk(r); let a,b; do{ a=ri(10,20); b=ri(8,15); }while(a<=b); const x=ri(1,3); return TQ(3,1,"이차방정식 (인수분해)",`가로 ${a} m, 세로 ${b} m인 직사각형 모양의 땅에 가로 방향과 세로 방향으로 폭이 같은 길을 하나씩 십자 모양으로 냈더니, 길을 뺀 땅의 넓이가 ${(a-x)*(b-x)} m²였습니다. 길의 폭은 몇 m?`,x,"길을 한쪽 끝으로 밀어 붙여도 남는 땅의 넓이는 같습니다. 남는 땅은 가로 (a − x), 세로 (b − x)인 직사각형입니다.",`(${a} − x)(${b} − x) = ${(a-x)*(b-x)} → x = ${x} 또는 ${a+b-x}. 폭은 땅보다 좁아야 하므로 ${x} m.`,{cn2:"문장을 식으로 세우기"}); },
  r=>{ const {ri}=mk(r); const L=4*ri(3,10); return TQ(3,2,"이차함수의 꼭짓점",`길이 ${L} m인 철망으로 한쪽 면이 벽인 직사각형 모양의 울타리를 만들려고 합니다(벽 쪽에는 철망을 치지 않음). 울타리 안 넓이의 최댓값은 몇 m²?`,L*L/8,"벽과 수직인 변의 길이를 x라 하면 벽과 나란한 변은 (전체 − 2x)입니다. 넓이를 x에 대한 이차식으로 쓰고 꼭짓점을 찾습니다.",`넓이 = x(${L} − 2x) = −2(x − ${L/4})² + ${L*L/8} → 최댓값 ${L*L/8} m².`,{cn2:"문장을 식으로 세우기"}); },
  r=>{ const {ri}=mk(r); const r1=ri(1,5),r2=ri(1,6); return TQ(3,1,"이차방정식 (인수분해)",`이차방정식 x² − ${r1+r2}x + ${r1*r2} = 0의 두 근을 α, β라 할 때 α² + β²의 값`,r1*r1+r2*r2,"두 근을 직접 구해도 되고, α² + β² = (α + β)² − 2αβ 를 써도 됩니다.",`(x − ${r1})(x − ${r2}) = 0 → ${r1}² + ${r2}² = ${r1*r1+r2*r2}.`,{cn2:"다항식의 전개"}); }
 ],
 /* 7 고1 */ [
  r=>{ const {ri}=mk(r); const r1=ri(1,3),r2=ri(1,4),s=r1+r2,p=r1*r2; return TQ(3,1,"근과 계수의 관계",`이차방정식 x² − ${s}x + ${p} = 0의 두 근을 α, β라 할 때 α³ + β³의 값`,r1**3+r2**3,"α³ + β³ = (α + β)³ − 3αβ(α + β). 근과 계수의 관계로 α + β, αβ를 바로 읽습니다.",`α + β = ${s}, αβ = ${p} → ${s}³ − 3 × ${p} × ${s} = ${r1**3+r2**3}.`,{cn2:"다항식의 전개"}); },
  r=>{ const {ri,pick}=mk(r); const n=ri(4,6),near=pick([true,false]),v=near?2*fact(n-1):fact(n)-2*fact(n-1); return TQ(3,4,"순열 (nPr)",`${n}명이 한 줄로 설 때, 특정한 두 사람 A, B가 ${near?"이웃하게":"이웃하지 않게"} 서는 경우의 수`,v,"이웃하는 두 사람을 한 묶음으로 보고 줄을 세운 뒤, 묶음 안에서 자리를 바꾸는 경우를 곱합니다. 이웃하지 않는 경우는 전체에서 뺍니다.",near?`묶음을 하나로 보면 ${n-1}! = ${fact(n-1)}, 묶음 안 2가지 → ${v}.`:`전체 ${n}! = ${fact(n)}, 이웃하는 경우 2 × ${n-1}! = ${2*fact(n-1)} → ${v}.`,{cn2:"곱의 법칙"}); },
  r=>{ const {ri}=mk(r); const m=ri(2,20); let cnt=0; for(let k=-10;k<=10;k++) if(k*k<m) cnt++; return TQ(3,1,"판별식 D = b² − 4ac",`모든 실수 x에 대하여 x² + 2kx + ${m} > 0이 성립하도록 하는 정수 k의 개수`,cnt,"항상 0보다 크려면 그래프가 x축과 만나지 않아야 합니다. 판별식의 부호 조건을 세우세요.",`D/4 = k² − ${m} < 0 → k² < ${m} → 정수 k는 ${cnt}개.`,{cn2:"이차부등식과 그래프"}); }
 ],
 /* 8 고2~3 */ [
  r=>{ const {ri}=mk(r); const n=ri(4,9); return TQ(3,1,"합의 기호 Σ와 거듭제곱의 합",`1×2 + 2×3 + 3×4 + … + ${n}×${n+1}의 값`,n*(n+1)*(n+2)/3,"일반항 k(k + 1) = k² + k 로 쪼개어 Σk²과 Σk 공식을 따로 씁니다.",`Σk² + Σk = ${n*(n+1)*(2*n+1)/6} + ${n*(n+1)/2} = ${n*(n+1)*(n+2)/3}.`); },
  r=>{ const {ri}=mk(r); const a=ri(1,3),b=ri(-5,5); return TQ(3,2,"극값과 도함수",`함수 f(x) = x³ − ${3*a*a}x${tm(b)}의 극댓값과 극솟값의 차`,4*a**3,"f′(x) = 0인 x를 구하고, 그 양쪽에서 f′의 부호가 어떻게 바뀌는지 확인합니다.",`f′(x) = 3x² − ${3*a*a} = 0 → x = ±${a}. f(−${a}) − f(${a}) = ${N(2*a**3+b)} − (${N(-2*a**3+b)}) = ${4*a**3}.`); },
  r=>{ const {pick}=mk(r); const [x,d,k]=pick([[4,2,3],[8,4,5],[8,6,4],[4,3,2],[8,7,3],[16,12,6],[2,1,1]]); return TQ(3,2,"로그 logₐ b",`방정식 log₂ x + log₂ (x − ${d}) = ${k}의 해`,x,"두 로그를 하나로 합친 뒤 지수 꼴로 바꿉니다. 마지막에 진수가 양수인지 꼭 확인하세요.",`x(x − ${d}) = ${2**k} → x = ${x} 또는 ${N(d-x)}. 진수 조건 x > ${d}이므로 x = ${x}.`,{cn2:"이차방정식 (인수분해)"}); }
 ]
];

/* =========================================================
   7F 과학실험과 — 문항 은행(정답을 c[0]에) + 계산 문항 생성기
   영역: 0 운동과 에너지 · 1 물질 · 2 생명 · 3 지구와 우주
   ========================================================= */
const SCI_TITLES=["주변 관찰과 계절","동식물과 날씨","물질·자석·지구","에너지·용해·생물·태양계","지권·힘·입자 운동","원소·전기·우리 몸·날씨","화학 반응·에너지·유전·별","통합과학","물리·화학·생명·지구 기초"];
/* 개념: 이름 → [영역, 설명] */
const SCI_CONCEPTS={
  "계절의 변화":[3,"봄·여름·가을·겨울은 기온과 낮의 길이가 달라요. 봄에는 새싹과 꽃, 여름에는 더위와 장마, 가을에는 단풍과 열매, 겨울에는 눈과 얼음을 볼 수 있어요."],
  "동물의 생김새":[2,"동물은 사는 곳과 움직이는 방법에 따라 생김새가 달라요. 새는 날개, 물고기는 지느러미, 곤충은 다리 6개와 몸이 머리·가슴·배 세 부분이에요."],
  "식물이 자라는 조건":[2,"식물이 자라려면 물, 햇빛, 알맞은 온도, 공기가 필요해요. 씨앗이 싹 틀 때는 물과 알맞은 온도가 특히 중요해요."],
  "낮과 밤":[3,"해가 떠 있는 동안이 낮, 진 뒤가 밤이에요. 해는 동쪽에서 떠서 남쪽 하늘을 지나 서쪽으로 져요. 해가 가장 높이 뜨는 한낮에 그림자가 가장 짧아요."],
  "우리 몸의 감각":[2,"눈으로 보고, 귀로 듣고, 코로 냄새 맡고, 혀로 맛보고, 피부로 만져서 느껴요. 이 다섯 가지가 오감이에요."],
  "물과 얼음":[1,"물은 차가워지면 얼음(고체)이 되고, 얼음은 따뜻해지면 다시 물(액체)이 돼요. 같은 물질이 온도에 따라 모습만 바뀌는 거예요."],
  "날씨와 생활":[3,"맑음·흐림·비·눈·바람 같은 날씨에 따라 옷차림과 준비물이 달라져요. 바람이 셀수록 바람개비가 빨리 돌아요."],
  "물에 뜨는 것과 가라앉는 것":[0,"같은 크기일 때 물보다 가벼운 것(나무, 스타이로폼)은 뜨고, 물보다 무거운 것(쇠, 돌, 유리)은 가라앉아요."],
  "동물의 한살이":[2,"동물이 태어나 자라서 자손을 남기는 과정이에요. 개구리는 알 → 올챙이 → 개구리, 나비는 알 → 애벌레 → 번데기 → 어른벌레, 닭은 알 → 병아리 → 닭."],
  "식물의 구조":[2,"뿌리는 물을 빨아들이고 식물을 지탱해요. 줄기는 물이 이동하는 길, 잎은 양분을 만드는 곳, 꽃은 씨를 만드는 곳, 열매는 씨를 품는 곳이에요."],
  "동물의 겨울나기":[2,"추운 겨울을 나려고 곰·개구리·뱀은 겨울잠을 자고, 철새는 따뜻한 곳으로 이동하고, 다람쥐는 먹이를 모아 둬요."],
  "빛과 그림자":[0,"빛이 물체에 막히면 뒤쪽에 그림자가 생겨요. 빛은 곧게 나아가기 때문이에요. 빛이 없으면 그림자도 없어요."],
  "자석":[0,"자석은 철로 된 물체를 끌어당겨요. 힘이 가장 센 양쪽 끝을 극이라 하고 N극과 S극이 있어요. 같은 극끼리는 밀어내고 다른 극끼리는 끌어당겨요. 나침반 바늘도 자석이라 N극이 북쪽을 가리켜요."],
  "측정 도구":[0,"온도는 온도계, 무게는 저울, 길이는 자, 시간은 시계로 재요. 작은 것을 크게 볼 때는 돋보기를 써요."],
  "물질의 상태":[1,"고체는 모양과 부피가 일정해요. 액체는 그릇에 따라 모양이 변하지만 부피는 일정해요. 기체는 모양도 부피도 일정하지 않고 공간을 가득 채워요."],
  "물의 상태 변화":[1,"물이 수증기가 되는 것은 증발(표면)·끓음(속까지), 수증기가 물이 되는 것은 응결이에요. 물이 얼면 부피가 늘어나서 얼음이 물에 떠요."],
  "식물의 한살이":[2,"씨가 싹 터서 잎과 줄기가 자라고, 꽃이 피고, 열매를 맺어 다시 씨를 만드는 과정이에요."],
  "지층과 화석":[3,"지층은 자갈·모래·진흙이 쌓여 굳은 층이에요. 화석은 옛날 생물의 몸이나 흔적이 지층에 남은 것으로, 당시 생물과 환경을 알려 줘요."],
  "흐르는 물의 작용":[3,"흐르는 물은 땅을 깎고(침식), 깎은 것을 나르고(운반), 느려지는 곳에 쌓아요(퇴적). 강 상류는 침식, 하류는 퇴적이 활발해요."],
  "화산과 지진":[3,"화산은 땅속 마그마가 분출해 생긴 지형이에요. 마그마가 식어 굳은 암석이 화성암이고, 지표에서 빨리 식은 현무암과 땅속에서 천천히 식은 화강암이 대표적이에요."],
  "지구와 달":[3,"달은 약 한 달을 주기로 초승달 → 상현달 → 보름달 → 하현달 → 그믐달로 모양이 변해요. 지구 표면의 약 70%는 바다예요."],
  "소리의 성질":[0,"소리는 물체가 떨릴 때 나요. 크게 떨리면 큰 소리, 빠르게 떨리면 높은 소리예요. 소리는 공기·물·고체를 통해 전달돼요."],
  "무게":[0,"무게는 지구가 물체를 끌어당기는 힘의 크기예요. 용수철은 매단 물체가 무거울수록 일정하게 더 늘어나서 무게를 잴 수 있어요."],
  "광합성과 증산 작용":[2,"광합성은 잎의 엽록체에서 빛·물·이산화 탄소로 양분(녹말)과 산소를 만드는 일이에요. 증산 작용은 잎의 기공으로 물이 수증기가 되어 빠져나가는 것이에요."],
  "우리 몸의 구조와 기능":[2,"호흡: 코 → 기관 → 기관지 → 폐. 순환: 심장이 펌프처럼 피를 온몸으로 보냄. 소화: 입 → 식도 → 위 → 작은창자 → 큰창자. 배설: 콩팥이 노폐물을 걸러 오줌을 만듦."],
  "태양계와 별":[3,"태양계는 태양과 그 둘레를 도는 8개 행성(수·금·지·화·목·토·천·해)이에요. 가장 큰 행성은 목성. 스스로 빛을 내는 천체가 별(항성), 별 둘레를 도는 것이 행성이에요."],
  "지구의 운동":[3,"지구가 하루에 한 바퀴 스스로 도는 것이 자전(→ 낮과 밤), 1년에 태양 둘레를 한 바퀴 도는 것이 공전이에요. 자전축이 기울어진 채 공전해서 계절이 생겨요."],
  "용해와 용액":[1,"용해는 어떤 물질이 다른 물질에 녹아 고르게 섞이는 현상이에요. 녹는 물질이 용질, 녹이는 물질이 용매, 섞인 것이 용액. 녹아도 없어지는 게 아니라서 무게는 용질 + 용매 그대로예요."],
  "연소와 소화":[1,"연소는 물질이 산소와 빠르게 반응해 빛과 열을 내는 현상이에요. 탈 물질·산소·발화점 이상의 온도, 세 가지가 모두 있어야 타고 하나만 없애도 불이 꺼져요."],
  "산과 염기":[1,"산성 용액은 푸른 리트머스 종이를 붉게, 염기성 용액은 붉은 리트머스 종이를 푸르게 바꿔요. pH가 7보다 작으면 산성, 7이면 중성, 7보다 크면 염기성이에요."],
  "전기 회로":[0,"전지·전선·전구가 끊어진 곳 없이 이어져야 전기가 흘러 불이 켜져요. 스위치는 회로를 잇거나 끊는 장치예요."],
  "빛과 렌즈":[0,"빛은 서로 다른 물질의 경계에서 꺾여요(굴절). 가운데가 두꺼운 볼록 렌즈는 빛을 한 점으로 모으고 물체를 크게 보이게 해요."],
  "열의 이동":[0,"열은 온도가 높은 곳에서 낮은 곳으로 이동해요. 고체에서는 전도, 액체·기체에서는 대류로 주로 이동해요."],
  "생태계":[2,"생산자(식물)는 스스로 양분을 만들고, 소비자(동물)는 다른 생물을 먹고, 분해자(곰팡이·세균)는 죽은 생물을 분해해요. 먹고 먹히는 관계가 먹이 사슬이에요."],
  "여러 가지 기체":[1,"공기는 질소 약 78%, 산소 약 21%와 소량의 이산화 탄소 등으로 이루어져요. 산소는 물질이 타는 것을 돕고, 이산화 탄소는 불을 끄는 데 쓰여요."],
  "속력":[0,"속력은 일정한 시간 동안 이동한 거리예요. 속력 = 이동 거리 ÷ 걸린 시간. 단위는 m/s, km/h."],
  "지권의 구조":[3,"지구 내부는 바깥부터 지각 → 맨틀 → 외핵 → 내핵이에요. 맨틀이 부피의 대부분을 차지하고, 외핵은 액체, 내핵은 고체예요."],
  "암석의 순환":[3,"화성암(마그마가 식음: 빨리 식은 현무암, 천천히 식은 화강암), 퇴적암(퇴적물이 굳음), 변성암(열과 압력으로 성질이 변함)은 환경에 따라 서로 다른 암석으로 바뀌어요."],
  "광물의 특성":[3,"광물은 색, 조흔색, 굳기, 자성, 염산 반응 등으로 구별해요. 굳기는 두 광물을 서로 긁어 어느 쪽이 긁히는지로 비교해요."],
  "여러 가지 힘":[0,"중력은 지구가 당기는 힘, 탄성력은 변형된 물체가 되돌아가려는 힘, 마찰력은 접촉면에서 운동을 방해하는 힘, 부력은 액체·기체가 물체를 위로 미는 힘이에요. 질량(kg)은 어디서나 같고, 무게(N)는 중력에 따라 달라져요. 지구에서 무게 = 9.8 × 질량."],
  "탄성력":[0,"용수철이 늘어난 길이는 매단 물체의 무게에 비례해요. 무게가 2배면 늘어난 길이도 2배."],
  "입자의 운동":[1,"물질을 이루는 입자는 스스로 끊임없이 움직여요. 입자가 스스로 퍼져 나가는 것이 확산, 액체 표면에서 기체로 변하는 것이 증발이에요."],
  "상태 변화":[1,"융해(고→액), 응고(액→고), 기화(액→기), 액화(기→액), 승화(고↔기). 상태가 변해도 입자의 종류와 수는 그대로이고 배열만 달라져요."],
  "기체의 성질":[1,"보일 법칙: 온도가 일정할 때 압력 × 부피 = 일정(압력이 2배면 부피는 절반). 샤를 법칙: 압력이 일정할 때 온도가 높아지면 부피가 늘어나요."],
  "생물의 분류":[2,"생물을 공통점으로 묶는 단계는 큰 것부터 계 → 문 → 강 → 목 → 과 → 속 → 종이에요. 종은 자연에서 짝짓기해 번식 가능한 자손을 낳는 무리예요."],
  "빛과 파동":[0,"빛의 삼원색은 빨강·초록·파랑이에요. 파동은 진동이 퍼져 나가는 현상으로, 진동 방향이 진행 방향과 수직이면 횡파(빛, 물결파), 나란하면 종파(소리)예요."],
  "과학 탐구 방법":[0,"문제 인식 → 가설 설정 → 탐구 설계와 수행 → 자료 해석 → 결론 도출. 가설은 실험으로 확인할 수 있는 잠정적인 답이에요."],
  "원소와 원자":[1,"원소는 물질을 이루는 기본 성분, 원자는 그 원소의 가장 작은 입자예요. 원자는 (+)전하의 원자핵과 (−)전하의 전자로 이루어지고 전체로는 중성이에요."],
  "이온":[1,"원자가 전자를 잃으면 (+)전하를 띤 양이온, 전자를 얻으면 (−)전하를 띤 음이온이 돼요."],
  "분자와 화학식":[1,"분자는 물질의 성질을 가진 가장 작은 입자예요. 화학식의 작은 숫자는 원자 수를 뜻해요. H₂O는 수소 원자 2개 + 산소 원자 1개."],
  "전기와 자기":[0,"전류(A)는 전하의 흐름, 전압(V)은 전류를 흐르게 하는 능력, 저항(Ω)은 흐름을 방해하는 정도예요. 전류가 흐르는 도선 주위에는 자기장이 생겨요."],
  "옴의 법칙":[0,"전류 = 전압 ÷ 저항 (I = V/R). 저항을 직렬로 이으면 전체 저항은 합이 되고, 각 저항에 걸리는 전압은 저항 크기에 비례해요."],
  "소화":[2,"큰 영양소를 작게 분해하는 과정이에요. 녹말은 아밀레이스, 단백질은 펩신·트립신, 지방은 라이페이스가 분해하고, 분해된 영양소는 소장의 융털에서 흡수돼요."],
  "순환":[2,"혈액은 혈장과 혈구로 이루어져요. 적혈구는 산소 운반, 백혈구는 식균 작용, 혈소판은 혈액 응고를 맡아요."],
  "호흡과 배설":[2,"폐의 폐포에서 산소와 이산화 탄소가 교환돼요. 콩팥의 네프론이 혈액 속 노폐물을 걸러 오줌을 만들어요."],
  "물질의 특성":[1,"밀도·끓는점·녹는점·용해도는 물질마다 고유해요. 밀도 = 질량 ÷ 부피. 순물질은 끓는점이 일정하지만 혼합물은 일정하지 않아요."],
  "기권과 날씨":[3,"기권은 아래부터 대류권(기상 현상) → 성층권(오존층) → 중간권 → 열권이에요. 이슬점은 수증기가 응결하기 시작하는 온도. 상대 습도(%) = 현재 수증기량 ÷ 포화 수증기량 × 100."],
  "화학 반응의 규칙":[1,"화학 반응이 일어나도 원자의 종류와 수는 변하지 않아요(질량 보존 법칙). 화합물을 이루는 성분의 질량비는 항상 일정해요(일정 성분비 법칙). 열을 내보내면 발열, 흡수하면 흡열 반응."],
  "화학 반응식":[1,"반응 전후 원자의 종류와 수가 같아지도록 계수를 맞춰요. 2H₂ + O₂ → 2H₂O 는 수소 원자 4개, 산소 원자 2개가 양쪽에서 같아요."],
  "운동과 에너지":[0,"등속 직선 운동은 속력과 방향이 일정한 운동이에요. 자유 낙하는 중력만 받아 1초에 9.8 m/s씩 빨라지는 운동으로 질량과 관계없어요. 운동 에너지 = ½ × 질량 × 속력², 위치 에너지 = 9.8 × 질량 × 높이."],
  "역학적 에너지 보존":[0,"역학적 에너지 = 위치 에너지 + 운동 에너지. 공기 저항과 마찰이 없으면 그 합은 일정해요. 떨어지는 동안 줄어든 위치 에너지만큼 운동 에너지가 늘어요."],
  "자극과 반응":[2,"감각 신경이 자극을 중추(뇌·척수)로 전달하고, 연합 신경이 판단하고, 운동 신경이 명령을 근육에 전해요. 호르몬 중 인슐린은 혈당을 낮추고 글루카곤은 높여요."],
  "생식과 유전":[2,"체세포 분열은 염색체 수가 그대로, 감수 분열은 절반이 돼요. 사람의 체세포 염색체는 46개(23쌍), 생식세포는 23개예요."],
  "멘델의 유전":[2,"대립 형질의 순종끼리 교배하면 잡종 1대에는 우성 형질만 나타나요(우열의 원리). 잡종 1대(Rr)끼리 교배하면 RR : Rr : rr = 1 : 2 : 1, 표현형은 우성 : 열성 = 3 : 1."],
  "별과 우주":[3,"등급의 숫자가 작을수록 밝은 별이에요. 별의 색은 표면 온도를 알려 주며 청색이 가장 뜨겁고 적색이 가장 차가워요. 우리은하는 막대 나선 모양이에요."],
  "빅뱅과 원소의 생성":[3,"빅뱅 직후 수소와 헬륨이 만들어졌어요. 별 내부 핵융합으로 철까지 만들어지고, 철보다 무거운 원소는 초신성 폭발 때 만들어져요."],
  "주기율표와 화학 결합":[1,"같은 족 원소는 원자가 전자 수가 같아 화학적 성질이 비슷해요. 금속 + 비금속은 전자를 주고받는 이온 결합, 비금속 + 비금속은 전자쌍을 공유하는 공유 결합을 해요."],
  "생명 시스템":[2,"단백질의 단위체는 아미노산, 핵산의 단위체는 뉴클레오타이드예요. DNA → (전사) → RNA → (번역) → 단백질. 효소는 활성화 에너지를 낮추는 생체 촉매이고, 삼투는 물이 세포막을 통해 농도가 높은 쪽으로 이동하는 현상이에요."],
  "산화 환원과 중화":[1,"산화는 전자를 잃는 것(산소를 얻는 것), 환원은 전자를 얻는 것이에요. 산의 H⁺과 염기의 OH⁻이 만나 물이 되는 반응이 중화 반응이에요."],
  "역학 시스템":[0,"알짜힘이 0이면 물체는 정지해 있거나 등속 직선 운동을 계속해요(관성). 알짜힘이 있으면 가속도 = 알짜힘 ÷ 질량. 정지 상태에서 등가속도 운동하면 이동 거리 = ½ × 가속도 × 시간²."],
  "운동량과 충격량":[0,"운동량 = 질량 × 속도. 충격량 = 힘 × 시간 = 운동량의 변화량. 충격량이 같을 때 충돌 시간을 길게 하면 받는 힘이 작아져요(에어백)."],
  "지구 시스템":[3,"해령(발산 경계)에서는 새 해양 지각이 만들어지고, 해구(수렴 경계)에서는 판이 소멸해요. 지권·기권·수권·생물권·외권이 서로 물질과 에너지를 주고받아요."],
  "에너지 전환과 발전":[0,"발전기는 코일 근처에서 자석이 움직일 때 전류가 유도되는 전자기 유도를 이용해요. 에너지 효율(%) = 유용하게 쓴 에너지 ÷ 공급한 에너지 × 100."],
  "지구 환경 변화":[3,"이산화 탄소·메테인 같은 온실 기체가 지구 복사 에너지를 흡수했다가 다시 내보내 지표를 따뜻하게 해요. 온실 기체가 늘면 지구 온난화가 심해져요."],
  "뉴턴 운동 법칙":[0,"제1법칙(관성), 제2법칙(F = ma), 제3법칙(작용 반작용: 크기가 같고 방향이 반대이며 서로 다른 물체에 작용). 외부 힘이 없으면 충돌 전후 운동량의 합은 보존돼요."],
  "열역학 법칙":[0,"제1법칙은 에너지 보존, 제2법칙은 열이 스스로 저온에서 고온으로 이동하지 않으며 열효율 100%인 열기관은 없다는 법칙이에요. 열효율 = (흡수한 열 − 방출한 열) ÷ 흡수한 열."],
  "특수 상대성 이론":[0,"두 가정: ① 모든 관성계에서 물리 법칙은 같다 ② 진공에서 빛의 속력은 관찰자와 광원의 운동에 관계없이 일정하다. 여기서 시간 지연, 길이 수축, 질량-에너지 동등성(E = mc²)이 나와요."],
  "파동의 성질":[0,"파동의 속력 = 진동수 × 파장 (v = fλ). 진동수는 1초 동안 진동한 횟수(Hz)예요."],
  "몰과 화학식량":[1,"1몰은 입자 6.02 × 10²³개의 묶음이에요. 물질 1몰의 질량(g)은 화학식량과 같아요. 몰수 = 질량 ÷ 화학식량."],
  "원자의 구조와 주기성":[1,"원자 번호 = 양성자 수. 질량수 = 양성자 수 + 중성자 수. 같은 주기에서 원자 번호가 커지면 핵전하가 커져 원자 반지름은 작아져요."],
  "분자 구조":[1,"중심 원자 주위 전자쌍이 서로 밀어내 분자 모양이 정해져요. CO₂는 직선형, H₂O는 굽은 형, NH₃는 삼각뿔형, CH₄는 정사면체형이에요."],
  "세포와 물질대사":[2,"세포 호흡은 주로 미토콘드리아에서 일어나 포도당을 분해해 ATP를 만들어요. 광합성은 엽록체에서 일어나요."],
  "신경과 항상성":[2,"자극을 받으면 Na⁺ 통로가 열려 Na⁺이 세포 안으로 들어오며 활동 전위가 생겨요(탈분극). 이어 K⁺이 밖으로 나가며 재분극돼요."],
  "방어 작용":[2,"B 림프구는 형질 세포로 분화해 항체를 만들고(체액성 면역), T 림프구는 감염된 세포를 직접 제거하거나 면역 반응을 도와요."],
  "생태계와 상호 작용":[2,"에너지는 순환하지 않고 한 방향으로 흐르며 영양 단계를 거칠수록 줄어들어요. 물질(탄소·질소)은 생태계 안에서 순환해요."],

  [/사이의 거리/, "두 점 사이의 거리",
   "두 점을 잇는 선분을 빗변으로, x좌표의 차와 y좌표의 차를 두 변으로 하는 직각삼각형을 그려 보세요. 피타고라스 정리로 거리 = √((x₂ − x₁)² + (y₂ − y₁)²)."],
  [/빗변|직각삼각형|피타고라스/, "피타고라스 정리",
   "직각삼각형에서 (빗변)² = (나머지 두 변의 제곱의 합). 빗변은 직각의 맞은편에 있는 가장 긴 변이에요. 빗변을 모를 땐 더하고, 빗변을 알고 다른 변을 구할 땐 빼서 제곱근을 구합니다."],
  [/원주각/, "원주각과 중심각",
   "같은 호에 대한 원주각은 중심각의 절반이에요. 원주각의 꼭짓점에서 중심을 지나는 지름을 그으면 이등변삼각형이 생기고, 삼각형의 외각 성질로 중심각이 원주각의 2배임이 나옵니다."],
  [/부채꼴/, "부채꼴의 넓이",
   "부채꼴은 원을 중심각만큼 잘라낸 조각이에요. 전체 원(360°)에서 중심각이 차지하는 비율만큼만 가져가므로 넓이 = πr² × (중심각/360). π는 원주율(약 3.14)을 나타내는 기호."],
  [/원의 넓이|원주율/, "원의 넓이",
   "원을 피자처럼 잘게 잘라 엇갈려 붙이면 가로가 ‘원주의 절반(반지름 × 원주율)’, 세로가 ‘반지름’인 직사각형이 돼요. 그래서 넓이 = 반지름 × 반지름 × 원주율."],
  [/분산/, "분산",
   "분산은 자료가 평균에서 얼마나 흩어져 있는지를 나타내요. ① 평균을 구하고 ② 각 자료에서 평균을 뺀 편차를 구한 뒤 ③ 편차를 제곱해서 ④ 평균을 냅니다. 편차를 그냥 더하면 항상 0이 되기 때문에 제곱해서 씁니다."],
  [/중앙값/, "중앙값",
   "자료를 크기 순서로 늘어놓았을 때 한가운데 값이에요. 개수가 짝수면 가운데 두 값의 평균. 반드시 먼저 정렬하세요."],
  [/최빈값/, "최빈값",
   "자료에서 가장 많이(자주) 나오는 값이에요."],
  [/평균/, "평균",
   "평균 = (자료의 합) ÷ (자료의 개수). 거꾸로 쓰면 (자료의 합) = 평균 × 개수라서, 평균을 알면 전체 합을 먼저 구할 수 있어요."],
  [/이차함수|꼭짓점|최솟값/, "이차함수의 꼭짓점",
   "y = a(x − p)² + q (표준형)에서 꼭짓점은 (p, q). (x − p)²는 항상 0 이상이라 x = p일 때 가장 작아지기 때문이에요(a > 0). 일반형은 완전제곱식으로 고칩니다: x² − 2px = (x − p)² − p²."],
  [/a√|= a√/, "근호 밖으로 꺼내기",
   "√(a² × b) = a√b. √ 안의 수를 ‘제곱수 × 나머지’로 나눈 뒤(예: 12 = 4 × 3), 제곱수는 √ 밖으로 꺼냅니다. √ 안에 제곱수가 남지 않을 때까지요."],
  [/√|제곱근|근호/, "제곱근 √",
   "√a(루트 a)는 제곱해서 a가 되는 양수예요(√9 = 3). √a × √b = √(ab), 그리고 √(a²) = a (a > 0)."],
  [/소인수분해/, "소인수분해",
   "자연수를 소수(1과 자기 자신만을 약수로 갖는 수: 2, 3, 5, 7…)들만의 곱으로 나타내는 거예요. 작은 소수부터 나눠 내려가고, 같은 소수가 몇 번 곱해졌는지가 그 소수의 지수입니다."],
  [/전개|곱셈 공식/, "다항식의 전개",
   "분배법칙으로 앞 괄호의 각 항을 뒤 괄호의 각 항에 모두 곱해 더해요. (x + a)(x + b) = x² + (a + b)x + ab, (x + a)² = x² + 2ax + a²."],
  [/인수분해|\(x [+−] .*\)\(x [+−]|= \(x/, "인수분해 (곱셈 공식 거꾸로)",
   "곱셈 공식을 거꾸로 쓰는 거예요. x² + (a+b)x + ab = (x + a)(x + b) → 더해서 x의 계수, 곱해서 상수항이 되는 두 수를 찾기. x² − a² = (x + a)(x − a) (합차 공식). x² + 2ax + a² = (x + a)²."],
  [/연립|x \+ y = \d+, /, "연립방정식 (가감법)",
   "문자가 2개면 식도 2개가 필요해요. 두 식을 더하거나 빼서 한 문자를 없애면(가감법) 문자 하나짜리 일차방정식이 됩니다. 그걸 먼저 풀고, 다른 식에 대입해 나머지를 구해요."],
  [/이차방정식|x² .*= 0/, "이차방정식 (인수분해)",
   "AB = 0이면 A = 0 또는 B = 0이에요. 그래서 (x − p)(x − q) = 0 으로 인수분해하면 x = p 또는 x = q. 더해서 −(x의 계수), 곱해서 상수항이 되는 두 수를 찾으세요."],
  [/부등식|>|≤|≥/, "일차부등식",
   "부등식도 방정식처럼 양변에 같은 수를 더하거나 빼도 돼요. 단, 음수를 곱하거나 나누면 부등호 방향이 바뀝니다. x의 범위를 구한 다음 문제가 묻는 수(정수·자연수)만 골라요."],
  [/x절편|y절편|기울기|일차함수/, "일차함수 y = ax + b",
   "a는 기울기: x가 1 늘 때 y가 늘어나는 양 = (y의 증가량)/(x의 증가량). b는 y절편: x = 0일 때 y값(그래프가 y축과 만나는 곳). x절편은 y = 0이 되는 x값(x축과 만나는 곳)."],
  [/반비례/, "반비례 y = a/x",
   "x가 2배, 3배가 되면 y는 1/2배, 1/3배가 되는 관계예요. 그래서 x × y가 항상 일정(= a)합니다. 주어진 한 쌍으로 a를 먼저 구하세요."],
  [/정비례/, "정비례 y = ax",
   "x가 2배, 3배가 되면 y도 2배, 3배가 되는 관계예요. y ÷ x가 항상 일정(= a)합니다. 주어진 한 쌍으로 a를 먼저 구하세요."],
  [/사분면/, "좌표평면의 사분면",
   "x축·y축이 평면을 네 부분으로 나눠요. 오른쪽 위(x > 0, y > 0)가 제1사분면, 시계 반대 방향으로 제2(x < 0, y > 0), 제3(둘 다 음수), 제4(x > 0, y < 0)사분면."],
  [/순환소수|̇/, "순환소수를 분수로",
   "소수점 아래에서 같은 숫자 배열(순환마디)이 끝없이 반복되는 소수예요. x = 0.333… 이라 하면 10x = 3.333…, 빼면 9x = 3. 반복 부분이 지워지는 원리라서 순환마디 숫자가 1개면 분모 9, 2개면 99가 됩니다."],
  [/각형의 내각/, "다각형의 내각의 합",
   "n각형의 한 꼭짓점에서 대각선을 모두 그으면 삼각형 n − 2개로 나뉘어요. 삼각형 하나의 내각의 합이 180°이므로 180° × (n − 2)."],
  [/이등변|밑각/, "이등변삼각형",
   "두 변의 길이가 같은 삼각형은 두 밑각의 크기도 같아요. 세 각의 합은 180°이니 (180° − 꼭지각)을 두 밑각이 똑같이 나눠 가집니다."],
  [/삼각형의 두 각|나머지 한 각/, "삼각형의 내각의 합",
   "삼각형의 세 각을 모두 더하면 항상 180°예요(세 각을 오려 붙이면 일직선)."],
  [/닮음/, "닮음비",
   "닮은 두 도형에서 대응하는 변의 길이의 비는 모두 같은 비(닮음비)를 이뤄요. 비례식 (작은 변) : (큰 변) = p : q 를 세웁니다."],
  [/정다면체|면의 개수/, "정다면체",
   "모든 면이 합동인 정다각형이고 각 꼭짓점에 모이는 면의 수가 같은 입체는 5가지뿐이에요: 정사면체·정육면체·정팔면체·정십이면체·정이십면체. 이름의 숫자가 면의 개수입니다."],
  [/평행사변형/, "평행사변형의 넓이",
   "평행사변형의 한쪽 삼각형을 잘라 반대편에 붙이면 직사각형이 돼요. 그래서 넓이 = 밑변 × 높이(밑변에 수직인 길이)."],
  [/삼각형의 넓이|인 삼각형의 넓이/, "삼각형의 넓이",
   "똑같은 삼각형 두 개를 붙이면 평행사변형이 돼요. 그래서 넓이 = 밑변 × 높이 ÷ 2."],
  [/직육면체|부피/, "직육면체의 부피",
   "부피는 1 cm³짜리 쌓기나무가 몇 개 들어가는지예요. 한 층에 가로 × 세로 개, 그런 층이 높이만큼 있으니 가로 × 세로 × 높이."],
  [/둘레/, "직사각형의 둘레",
   "둘레는 테두리 길이의 합이에요. 직사각형은 가로 2개, 세로 2개이니 (가로 + 세로) × 2."],
  [/규칙/, "수의 규칙 찾기",
   "이웃한 두 수의 차(얼마씩 커지나) 또는 몇 배씩 커지는지를 먼저 확인하고, 그 규칙을 마지막 수에 한 번 더 적용해요."],
  [/가를|모으/, "가르기와 모으기",
   "10을 두 수로 가르면 두 수의 합이 10이에요(1과 9, 2와 8 …). 10에서 한 수를 빼면 나머지가 나옵니다."],
  [/연속하는|나이|아버지|공책|어떤 수|x의 .*배/, "문장을 식으로 세우기",
   "구하려는 것을 x로 놓고, 문장에 나온 ‘같다·합·몇 배’ 관계를 등식으로 옮겨요. 연속하는 자연수는 n, n+1, n+2. 몇 년 후 나이는 두 사람 모두 같은 만큼 늘어납니다."],
  [/로 나눌 때|비례배분/, "비례배분",
   "전체를 p : q로 나누면 전체를 (p + q)조각으로 쪼개 p조각, q조각씩 나눠 가지는 거예요. 큰 쪽 = 전체 × (큰 비)/(p + q)."],
  [/:/, "비와 비례식",
   "비의 앞항과 뒤항에 같은 수를 곱하거나 나눠도 비율은 같아요. 비례식에서는 (바깥쪽 두 항의 곱) = (안쪽 두 항의 곱)."],
  [/%|할인|백분율/, "백분율",
   "%는 전체를 100으로 볼 때의 크기예요. a의 p% = a × p/100. p% 할인한 값은 (100 − p)%만 내는 것이니 정가 × (100 − p)/100. 분수를 %로 바꿀 땐 × 100."],
  [/최대공약수/, "최대공약수",
   "두 수의 공통인 약수 중 가장 큰 수예요. 두 수를 소인수분해(또는 공통 약수로 계속 나누기)해서 공통으로 들어 있는 것만 곱합니다."],
  [/최소공배수/, "최소공배수",
   "두 수의 공통인 배수 중 가장 작은 수예요. 큰 수의 배수를 차례로 쓰면서 작은 수로도 나누어떨어지는 첫 수를 찾거나, 공통 약수로 나눈 뒤 몫까지 모두 곱합니다."],
  [/÷.*나머지/, "나머지가 있는 나눗셈",
   "(나누는 수) × (몫) + (나머지) = (나누어지는 수). 나머지는 항상 나누는 수보다 작아야 해요. 몫을 최대한 크게 잡고 남는 것이 나머지."],
  [/\d\/\d|분수|기약/, "분수의 계산과 약분",
   "분모가 같아야 분자끼리 더하고 뺄 수 있어요. 분모가 다르면 통분(분모를 최소공배수로 맞추고 분자에도 같은 수를 곱함)합니다. 기약분수는 분모와 분자를 최대공약수로 나눠 더 이상 약분되지 않는 분수."],
  [/\d\.\d|0\.\d|소수/, "소수의 계산",
   "덧셈·뺄셈은 소수점 자리를 맞춰서 계산해요. 곱셈은 자연수처럼 곱한 뒤 소수점 아래 자릿수만큼 소수점을 찍고, 나눗셈은 몫의 소수점을 나누어지는 수의 소수점 위치에 맞춥니다."],
  [/더 큰|수의 크기/, "수의 크기 비교",
   "자릿수가 많은 쪽이 커요. 자릿수가 같으면 가장 높은 자리부터 차례로 비교합니다."],
  [/kg|cm|m |g =|분|초|시간/, "단위 바꾸기",
   "1 m = 100 cm, 1 kg = 1000 g, 1시간 = 60분, 1분 = 60초. 큰 단위를 작은 단위로 바꿀 땐 곱하고, 작은 단위 값을 그대로 더합니다."],
  [/바늘|시계/, "시계 보기",
   "짧은바늘은 ‘시’, 긴바늘은 ‘분’을 가리켜요. 긴바늘이 12에 있으면 정각(○시)입니다."],
  [/계수|상수항|간단히/, "동류항 정리",
   "분배법칙으로 괄호를 풀어요(괄호 앞이 −면 안의 부호가 모두 바뀜). 그다음 문자가 같은 항(동류항)끼리 모읍니다. 계수는 문자 앞의 수, 상수항은 문자가 없는 수."],
  [/지수법칙|단항식|a[⁰¹²³⁴⁵⁶⁷⁸⁹]+ × a|x[⁰¹²³⁴⁵⁶⁷⁸⁹]+\) ×/, "지수법칙 (곱)",
   "aᵐ × aⁿ = aᵐ⁺ⁿ. a를 m번 곱하고 이어서 n번 더 곱했으니 모두 m + n번 곱한 셈이에요. 단항식의 곱은 계수(숫자)끼리 곱하고, 같은 문자끼리는 지수를 더합니다."],
  [/방정식|x의 값|□/, "등식의 성질",
   "등식은 양변에 같은 수를 더하거나 빼고, 같은 수를 곱하거나 (0이 아닌 수로) 나눠도 성립해요. 이걸로 모르는 수(□, x)만 한쪽에 남깁니다. 덧셈의 반대는 뺄셈, 곱셈의 반대는 나눗셈."],
  [/뛰어/, "뛰어 세기",
   "같은 수만큼 여러 번 더하는 거예요. d씩 k번 뛰어 세면 처음 수 + d × k."],
  [/자리|10개씩|100이|1000이|10000이/, "자릿값",
   "같은 숫자라도 어느 자리에 있느냐에 따라 값이 달라요. 10이 a개면 a0, 100이 a개면 a00. 각 자리의 값을 더해 수를 만듭니다."],
  [/−[0-9]|\(−|정수/, "정수의 계산",
   "부호가 같은 두 수의 덧셈은 절댓값끼리 더하고 그 부호를, 다르면 큰 절댓값에서 작은 것을 빼고 큰 쪽 부호를 붙여요. 빼기는 ‘빼는 수의 부호를 바꿔 더하기’. 곱셈·나눗셈은 부호가 같으면 +, 다르면 −."],
  [/[×÷] .* [+−] |[+−] .* [×÷]|혼합/, "계산 순서",

  [/x = [−\d]+일 때|대입/, "식의 값 (대입)",

function conceptOf(q, subj){
  if(q.cn){ const b=conceptBody(q.cn,subj); if(b!=null) return {name:q.cn, body:b}; }
  if(subj==="과학") return {name:q.cn||"과학 개념", body:"문제에서 묻는 현상이 무엇인지, 어떤 양을 구하는지 먼저 정리해 보세요."};
  const src = `${q.k||""} | ${q.p||""}`;
  if(subj==="국어") for(const [re,name,body] of KOR_ITEM_CONCEPTS) if(re.test(q.p||"")) return {name, body};
  const list = subj==="국어" ? KOR_CONCEPTS : MATH_CONCEPTS;
  for(const [re,name,body] of list) if(re.test(src)) return {name, body};
  if(subj==="국어") return {name:"헷갈리는 말 구별",
    body:"소리가 비슷하거나 뜻이 가까운 말은 문장 속에서 어떤 뜻으로 쓰였는지 보고 골라요. 빈칸 앞뒤 낱말과 문장 전체의 뜻을 먼저 확인하세요."};
  return {name:q.k||"문제 이해", body:"문제가 묻는 것과 주어진 조건을 먼저 정리하고, 그 조건을 식으로 옮겨 보세요."};
}
function conceptHtml(q, subj){
  const c = conceptOf(q, subj);
  return `<div class="concept"><b>필요한 개념 · ${esc(c.name)}</b>${esc(c.body)}</div>`;
}

  "인수분해 (곱셈 공식 거꾸로)": ["전개를 거꾸로 하는 거예요. x² + □x + △ 이면 ‘더해서 □, 곱해서 △’인 두 수를 찾아요.", "x² + 5x + 6 → 2와 3 → (x + 2)(x + 3)"],
  "연립방정식 (가감법)": ["두 식을 더하거나 빼서 문자 하나를 없애요. 남은 문자부터 구하고, 그 값을 다른 식에 넣어요.", "x + y = 5, x − y = 1 → 더하면 2x = 6 → x = 3, y = 2"],
  "이차방정식 (인수분해)": ["(x − p)(x − q) = 0 으로 바꾸면 답은 x = p 또는 x = q예요. 곱해서 0이면 둘 중 하나가 0이니까요.", "x² − 5x + 6 = 0 → (x − 2)(x − 3) = 0 → x = 2 또는 3"],
  "일차부등식": ["방정식처럼 풀면 돼요. 단, 음수로 곱하거나 나누면 부등호 방향이 반대로 바뀌어요.", "2x − 1 > 5 → 2x > 6 → x > 3"],
  "일차함수 y = ax + b": ["a는 기울기(x가 1 늘 때 y가 늘어나는 양), b는 y절편(x가 0일 때 y). x절편은 y가 0이 되는 x예요.", "y = 2x + 3 → 기울기 2, y절편 3, x절편 −3/2"],
  "반비례 y = a/x": ["x가 2배가 되면 y는 절반이 돼요. x × y가 항상 같아요.", "x = 2일 때 y = 6 → x × y = 12 → x = 4이면 y = 3"],
  "정비례 y = ax": ["x가 2배가 되면 y도 2배가 돼요. y ÷ x가 항상 같아요.", "x = 2일 때 y = 6 → y = 3x → x = 5이면 y = 15"],
  "좌표평면의 사분면": ["오른쪽 위가 제1사분면, 왼쪽 위 제2, 왼쪽 아래 제3, 오른쪽 아래 제4사분면이에요(시계 반대 방향).", "(−2, 3) → 왼쪽 위 → 제2사분면"],
  "순환소수를 분수로": ["반복되는 숫자가 1개면 분모 9, 2개면 분모 99로 써요.", "0.555… = 5/9, 0.2727… = 27/99 = 3/11"],
  "다각형의 내각의 합": ["n각형의 각을 모두 더하면 180° × (n − 2)", "오각형 → 180° × 3 = 540°"],
  "이등변삼각형": ["두 변이 같은 삼각형은 아래 두 각(밑각)도 같아요. 두 밑각 = (180° − 꼭지각) ÷ 2.", "꼭지각 40° → 밑각 (180 − 40) ÷ 2 = 70°"],
  "삼각형의 내각의 합": ["삼각형의 세 각을 더하면 항상 180°예요.", "50° + 60° + □ = 180° → □ = 70°"],
  "닮음비": ["닮은 도형은 대응하는 변의 길이 비가 모두 같아요. 비례식을 세우세요.", "닮음비 1 : 3, 작은 변 4 → 큰 변 12"],
  "정다면체": ["모든 면이 똑같은 정다각형인 입체예요. 이름 속 숫자가 면의 개수예요.", "정육면체(주사위 모양) → 면 6개"],
  "평행사변형의 넓이": ["넓이 = 밑변 × 높이", "밑변 5, 높이 4 → 20"],
  "삼각형의 넓이": ["넓이 = 밑변 × 높이 ÷ 2", "밑변 6, 높이 4 → 12"],
  "직육면체의 부피": ["부피 = 가로 × 세로 × 높이", "2 × 3 × 4 = 24 cm³"],
  "직사각형의 둘레": ["둘레 = (가로 + 세로) × 2", "가로 5, 세로 3 → 16 cm"],
  "수의 규칙 찾기": ["옆 수와 얼마나 차이 나는지(또는 몇 배인지) 보고, 그 규칙대로 하나 더 해요.", "2, 4, 6, 8 → 2씩 커짐 → 다음은 10"],
  "가르기와 모으기": ["10을 두 수로 나누면 두 수를 더해 10이 돼요.", "10은 4와 6, 7과 3"],
  "문장을 식으로 세우기": ["모르는 수를 □나 x로 놓고, 문장을 그대로 식으로 옮겨요.", "어떤 수에 3을 더하면 10 → x + 3 = 10 → x = 7"],
  "비례배분": ["전체를 p : q로 나누면 전체를 (p + q)조각으로 나눠 p조각, q조각씩 가져요.", "20을 2 : 3 → 한 조각 4 → 8과 12"],
  "비와 비례식": ["비의 앞뒤에 같은 수를 곱해도 같은 비예요.", "2 : 3 = 4 : 6 (둘 다 2배)"],
  "백분율": ["%는 100 중에 몇인지예요. a의 p% = a × p ÷ 100.", "200의 10% = 20, 20% 할인이면 80%만 냄"],
  "최대공약수": ["두 수를 모두 나누어떨어지게 하는 수 중 가장 큰 수예요.", "12와 18 → 6"],
  "최소공배수": ["두 수의 배수 중 처음으로 겹치는 수예요.", "4와 6 → 12"],
  "나머지가 있는 나눗셈": ["나누는 수 × 몫 + 나머지 = 원래 수. 나머지는 나누는 수보다 작아야 해요.", "17 ÷ 5 = 3 … 2 (5 × 3 + 2 = 17)"],
  "분수의 계산과 약분": ["분모가 같아야 분자끼리 더할 수 있어요. 다르면 분모를 같게 맞춰요(통분). 마지막엔 더 나눌 수 없게 약분해요.", "1/2 + 1/3 = 3/6 + 2/6 = 5/6"],
  "소수의 계산": ["더하고 뺄 땐 소수점 위치를 맞춰요. 곱할 땐 자연수처럼 곱하고 소수점 자리 수만큼 찍어요.", "1.2 × 3 = 3.6"],
  "수의 크기 비교": ["자리 수가 많은 수가 커요. 같으면 맨 앞자리부터 비교해요.", "35와 53 → 앞자리 3 < 5 → 53이 더 커요"],
  "단위 바꾸기": ["1 m = 100 cm, 1 kg = 1000 g, 1시간 = 60분, 1분 = 60초", "2 m 5 cm = 200 + 5 = 205 cm"],
  "시계 보기": ["짧은바늘은 ‘시’, 긴바늘은 ‘분’. 긴바늘이 12에 있으면 딱 ○시예요.", "짧은바늘 3, 긴바늘 12 → 3시"],
  "동류항 정리": ["괄호를 풀고(앞이 −면 부호 반대로), x는 x끼리, 숫자는 숫자끼리 모아요.", "2(x + 1) − (x − 3) = 2x + 2 − x + 3 = x + 5"],
  "지수법칙 (곱)": ["같은 문자끼리 곱하면 작은 숫자(지수)를 더해요. 앞 숫자(계수)끼리는 곱해요.", "a² × a³ = a⁵, 2x × 3x² = 6x³"],
  "등식의 성질": ["= 양쪽에 똑같이 더하고, 빼고, 곱하고, 나눠도 돼요. 그렇게 해서 □나 x만 남겨요.", "□ + 4 = 9 → 양쪽에서 4 빼기 → □ = 5"],
  "뛰어 세기": ["같은 수만큼 계속 더하는 거예요.", "10에서 5씩 3번 → 15, 20, 25"],
  "자릿값": ["어느 자리에 있느냐에 따라 값이 달라요. 100이 3개면 300, 10이 2개면 20.", "100이 3개, 10이 2개, 1이 5개 → 325"],
  "정수의 계산": ["빼기는 ‘부호 바꿔서 더하기’. 곱하기는 부호가 같으면 +, 다르면 −.", "(−3) − (+2) = (−3) + (−2) = −5, (−2) × (−4) = 8"],
  "계산 순서": ["괄호 → 곱하기·나누기 → 더하기·빼기 순서예요. 같은 단계면 왼쪽부터.", "2 + 3 × 4 = 2 + 12 = 14"],
  "식의 값 (대입)": ["x 자리에 숫자를 넣어서 계산해요. 음수를 넣을 땐 괄호를 꼭 써요.", "x = −2일 때 x² + 1 = (−2)² + 1 = 5"],
  "거듭제곱": ["a³은 a를 3번 곱한 거예요. 음수를 짝수 번 곱하면 +, 홀수 번이면 −.", "2³ = 8, (−2)³ = −8, (−2)² = 4"],
  "곱셈": ["같은 수를 여러 번 더하는 거예요. 큰 수는 자리별로 나눠서 곱해요.", "23 × 3 = 20 × 3 + 3 × 3 = 69"],
  "나눗셈": ["곱셈을 거꾸로 하는 거예요. 24 ÷ 6은 ‘6에 뭘 곱하면 24?’", "6 × 4 = 24 → 24 ÷ 6 = 4"],
  "덧셈과 뺄셈 섞인 계산": ["왼쪽부터 차례대로 계산해요.", "10 − 3 + 2 = 7 + 2 = 9"],
  "받아올림이 있는 덧셈": ["같은 자리끼리 더하고, 10이 넘으면 윗자리로 1을 올려요.", "28 + 15 → 8 + 5 = 13 → 3 쓰고 1 올림 → 43"],
  "받아내림이 있는 뺄셈": ["같은 자리끼리 빼고, 모자라면 윗자리에서 10을 빌려 와요.", "42 − 17 → 12 − 7 = 5, 3 − 1 = 2 → 25"],

  "높임 표현": ["높이는 사람에 따라 말이 바뀌어요. 주어를 높일 땐 ‘-시-, 께서’, 받는 사람을 높일 땐 ‘께, 드리다’, 듣는 사람을 높일 땐 ‘-습니다, -요’. 밥 → 진지, 집 → 댁처럼 따로 쓰는 말도 있어요.", "할머니께서 진지를 드신다."],
  "반의어": ["뜻이 서로 반대인 말이에요.", "크다 ↔ 작다, 열다 ↔ 닫다"],
  "낱말 사이의 의미 관계": ["뜻이 비슷하면 유의어, 반대면 반의어, 한쪽이 다른 쪽을 품으면 상위어·하위어예요.", "동물(상위어) ⊃ 강아지(하위어)"],
  "낱말의 묶음 (상위어·하위어)": ["넓은 말 아래 여러 작은 말이 들어가요. 어느 묶음에 드는지 따져 보세요.", "과일: 사과, 배, 포도 / 채소: 당근, 오이"],
  "단어의 짜임": ["뜻 있는 말끼리 붙으면 합성어, 뜻 있는 말에 ‘풋-, -이’ 같은 꾸밈 조각이 붙으면 파생어예요.", "밤 + 나무 = 밤나무(합성어), 풋 + 사과 = 풋사과(파생어)"],
  "품사 (9품사)": ["낱말을 하는 일에 따라 나눈 거예요. 이름(명사), 움직임(동사), 상태(형용사), 꾸밈(관형사·부사), 붙는 말(조사), 느낌(감탄사) 등이 있어요.", "‘하늘이 정말 맑다’ → 하늘(명사), 정말(부사), 맑다(형용사)"],
  "문장 성분": ["문장에서 맡은 역할이에요. 누가(주어), 무엇을(목적어), 어찌하다(서술어), 꾸며 주는 말(관형어·부사어).", "‘동생이 밥을 먹는다’ → 동생이(주어) 밥을(목적어) 먹는다(서술어)"],
  "음운 변동": ["글자와 실제 소리가 달라지는 규칙이에요. 어떤 소리가 무엇으로 바뀌었는지 보세요.", "국물 → [궁물], 신라 → [실라], 좋고 → [조코]"],
  "소설의 구성 단계": ["발단(시작) → 전개(갈등 시작) → 위기(갈등 커짐) → 절정(갈등 최고) → 결말(해결)", "주인공 소개 = 발단, 가장 긴장되는 장면 = 절정"],
  "표현 방법": ["‘~처럼/같이’로 빗대면 직유, ‘A는 B다’로 빗대면 은유, 사물을 사람처럼 쓰면 의인법, 반대로 말하면 반어법이에요.", "‘별처럼 빛나는 눈’(직유), ‘시간은 금이다’(은유)"],
  "소설의 시점": ["이야기하는 사람이 누구인지예요. ‘나’가 내 이야기를 하면 1인칭 주인공, ‘나’가 남을 지켜보면 1인칭 관찰자, 밖에서 속마음까지 다 알면 전지적 작가 시점.", "‘나는 그날 울었다’ → 1인칭 주인공 시점"],
  "띄어쓰기": ["낱말은 띄어 쓰고, ‘은/는/이/가/을/를’ 같은 조사는 앞말에 붙여요.", "학교에 간다 (O) / 학교 에 간다 (X)"],
  "사이시옷": ["두 낱말이 합쳐질 때 뒷말 소리가 세지거나 ㄴ 소리가 덧나면 ㅅ을 받쳐 적어요.", "나무 + 잎 → 나뭇잎, 바다 + 가 → 바닷가"],
  "문장 부호": ["설명하면 마침표(.), 물으면 물음표(?), 느낌이면 느낌표(!), 부르거나 늘어놓을 땐 쉼표(,)", "철수야, 밥 먹었니?"],
  "속담과 관용 표현": ["글자 그대로가 아니라 숨은 뜻으로 쓰는 말이에요. 어떤 상황에 쓰는지 떠올려 보세요.", "‘입이 무겁다’ = 비밀을 잘 지킨다"],
  "세는 말 (단위)": ["물건마다 세는 말이 달라요.", "연필 한 자루, 신발 한 켤레, 책 한 권, 나무 한 그루"],
  "훈민정음과 중세 국어": ["자음은 소리 내는 입 모양을 본떠 만들고, 획을 더해 센 소리를 만들었어요(ㄱ → ㅋ). 모음은 하늘(·), 땅(ㅡ), 사람(ㅣ)을 본떴어요.", "ㄴ → ㄷ → ㅌ (획을 더할수록 센 소리)"],
  "한글의 짜임": ["글자는 자음(ㄱ, ㄴ…)과 모음(ㅏ, ㅑ…)으로 만들어요. 맨 아래 자음이 받침이에요.", "‘밤’ = ㅂ + ㅏ + ㅁ(받침)"],
  "기본형과 국어사전": ["사전에서는 ‘-다’가 붙은 기본 모양으로 찾아요.", "먹었다, 먹고 → ‘먹다’로 찾기"],
  "고유어·한자어·외래어": ["원래 우리말은 고유어, 한자로 만든 말은 한자어, 다른 나라에서 들어온 말은 외래어예요.", "하늘(고유어), 학교(한자어), 버스(외래어)"],
  "한글 맞춤법의 원칙": ["소리 나는 대로 쓰되, 뜻을 알아보기 쉽게 원래 모양을 살려 써요.", "꽃이 → [꼬치]로 소리 나도 ‘꽃이’로 써요"],
  "문장의 짜임": ["‘누가 어찌하다’가 한 번이면 홑문장, 두 번 이상이면 겹문장이에요.", "‘비가 오고 바람이 분다’ → 겹문장"],
  "피동과 사동": ["남에게 ‘당하면’ 피동, 남에게 ‘시키면’ 사동이에요.", "도둑이 잡혔다(피동), 동생에게 책을 읽혔다(사동)"],
  "선어말 어미": ["말 끝 앞에 끼어드는 작은 조각이에요. ‘-시-’는 높임, ‘-었-’은 과거, ‘-겠-’은 추측·미래.", "가 + 시 + 었 + 다 → 가셨다"],
  "부정 표현": ["‘안’은 하기 싫어서 안 함, ‘못’은 하고 싶어도 할 수 없음.", "안 먹었다(먹기 싫어서), 못 먹었다(배가 아파서)"],
  "발화의 의도": ["말의 모양과 진짜 뜻이 다를 수 있어요. 물어보는 것 같아도 실제로는 부탁일 때가 있어요.", "‘여기 좀 덥지 않니?’ → 실제로는 에어컨을 켜 달라는 부탁"],
  "문장의 종류": ["설명(평서문), 물음(의문문), 시킴(명령문), 같이 하자(청유문), 느낌(감탄문)", "‘조용히 해.’ → 명령문"],

/* 한 문항에 필요한 개념 모두: 주 개념 + 그 개념을 쓰려면 먼저 알아야 하는 선수 개념(최대 2개) */
const PREREQ={

const CONCEPT_BY_NAME=new Map(MATH_CONCEPTS.map(([re,name,body])=>[name,{name,body}]));
function conceptsOf(q, subj){
  const first=conceptOf(q,subj);
  const second = q.cn2 && q.cn2!==first.name && conceptBody(q.cn2,subj)!=null ? [{name:q.cn2, body:conceptBody(q.cn2,subj)}] : [];
  if(subj!=="수학") return [first, ...second];
  const out=[first, ...second, ...(PREREQ[first.name]||[]).map(n=>CONCEPT_BY_NAME.get(n)).filter(Boolean)];
  return out.filter((c,i)=>out.findIndex(z=>z.name===c.name)===i).slice(0,3);
}
function conceptBlock(c, label){
  const [easy,ex]=easyOf(c), deep=c.body&&c.body!==easy;
  return `<b>${label||""}${esc(c.name)}</b><span class="concept-b">${esc(easy)}</span>${ex?`<span class="concept-ex">예) ${esc(ex)}</span>`:""}${deep?`<details class="deep"><summary>왜 그럴까? (자세히)</summary>${esc(c.body)}</details>`:""}`;
}
function conceptsHtml(q, subj){
  const cs=conceptsOf(q,subj);
  return `<div class="concept"><span class="concept-h">이 문제에 필요한 개념${cs.length>1?` ${cs.length}가지`:""}</span>${cs.map((c,k)=>conceptBlock(c,k?"함께 필요한 개념 · ":"")).join("")}</div>`;
}

/* 생성기 하나가 다루는 개념 이름 (고정 시드로 한 번 뽑아 기억) */
const KINDS=["norm","think","t2","t3"], KTAG=["n","t","d","c"];      /* 일반 · 생각 1단계 · 결합 문제 · 도전 과제 */
const kindIdx=t=> t===true?1 : (t===false||t==null)?0 : t;
function gensOf(subj){ return subj==="과학" ? SCI_GEN : MATH_GEN; }
const GEN_CONCEPT={}, GEN_DOMAIN={};
function genSample(L,kd,i,subj){ const list=gensOf(subj)[L][KINDS[kd]]; return (list[i]||list[0])(rng(9173+i*31+L+(kd>1?kd*977:0))); }
function genConceptName(L,think,i,subj){
  subj=subj||"수학"; const kd=kindIdx(think), key=subj+KTAG[kd]+L+":"+i;
  if(!(key in GEN_CONCEPT)){ const q=genSample(L,kd,i,subj); GEN_CONCEPT[key]=conceptOf(q,subj).name; GEN_DOMAIN[key]=domainOf(q,subj); }
  return GEN_CONCEPT[key];
}
function genDomain(L,kd,i,subj){ genConceptName(L,kd,i,subj); return GEN_DOMAIN[subj+KTAG[kd]+L+":"+i]; }
function korConceptName(L,k,subj){ subj=subj||"국어"; const it=bankOf(subj)[L][k]; return conceptOf({p:it.p,k:"",cn:it.cn},subj).name; }

/* 단원(=지금 급의 학습 범위) 개념 목록 */
const UNIT_CACHE={};
function unitConcepts(subj,g){
  const key=subj+g; if(UNIT_CACHE[key]) return UNIT_CACHE[key];
  const seen=new Map();
  const add=(c,think)=>{ if(!seen.has(c.name)) seen.set(c.name,{name:c.name, body:c.body, think}); else if(!think) seen.get(c.name).think=false; };
  GRADES[g].lv.forEach(L=>{
    if(subj!=="수학") bankOf(subj)[L].forEach(it=>add(conceptOf({p:it.p,k:"",cn:it.cn},subj),false));
    if(subj!=="국어") KINDS.forEach((kn,kd)=>(gensOf(subj)[L][kn]||[]).forEach((f,i)=>add(conceptOf(genSample(L,kd,i,subj),subj),kd>0)));
  });
  return UNIT_CACHE[key]=[...seen.values()];
}

/* 익힘 기록: 개념마다 처음 회신 기준으로 몇 번 봤고 몇 번 한 번에 맞혔나 */
function learnOf(subj){ S.learn=S.learn||{}; return S.learn[subj]=S.learn[subj]||{}; }
function noteLearn(subj,q,ok){
  const m=learnOf(subj), n=conceptOf(q,subj).name; const st=m[n]=m[n]||{seen:0,ok:0}; st.seen++; if(ok) st.ok++;
  if(!q.spaced && !ok){ try{ st.src=JSON.parse(JSON.stringify(q)); }catch(e){} }   /* 틀린 그 문제를 기억해 두었다가 간격 복습에 그대로 냄 */
  /* 간격 복습: 익힌 개념은 3일 뒤, 맞히면 7일 뒤 한 번 더. 복습에서 틀리면 ‘학습 중’으로 되돌림 */
  const now=Date.now(), DAY=86400000;
  if(q.spaced){
    if(ok){ st.stage=(st.stage||0)+1; st.due = st.stage<CONFIG.spacedDays.length ? now+CONFIG.spacedDays[st.stage]*DAY : 0; }
    else { st.ok=Math.min(st.ok,LEARN_DONE-1); st.stage=0; delete st.due; }
  } else if(st.ok>=LEARN_DONE && st.due===undefined){ st.stage=0; st.due=now+CONFIG.spacedDays[0]*DAY; }
  /* 학습 지도: 학년 수준 × 영역별 첫 회신 기록 */
  const lv=levelOfQ(q); if(lv!=null){ S.dmap=S.dmap||{}; const dm=S.dmap[subj]=S.dmap[subj]||{}, key=lv+"|"+domainOf(q,subj); const c=dm[key]=dm[key]||{n:0,ok:0}; c.n++; if(ok) c.ok++; }
}
const LEARN_DONE=2;   // 처음 회신에서 두 번 맞히면 익힘
function learnState(subj,name){ const st=learnOf(subj)[name]; return !st?"new" : st.ok>=LEARN_DONE?"done":"doing"; }
function learnPrio(subj,name){ const st=learnOf(subj)[name]; return !st?0 : 1+st.ok; }
function unitProgress(subj,g){ const u=unitConcepts(subj,g); return {done:u.filter(c=>learnState(subj,c.name)==="done").length, total:u.length}; }

/* 안 익힌 개념부터: 같은 문서 안에서는 같은 개념을 되도록 피함 */
function pickByPrio(cands, nameOf, subj, used, r){
  let best=Infinity, pool=[];
  cands.forEach(c=>{ const nm=nameOf(c); const p=learnPrio(subj,nm)+(used&&used.has("c:"+nm)?50:0);
    if(p<best){ best=p; pool=[c]; } else if(p===best) pool.push(c); });
  return pool[Math.floor(r()*pool.length)];
}
function mathItemLearn(L,r,think,used,subj){
  subj=subj||"수학"; const G=gensOf(subj)[L]; let kd=kindIdx(think), list=G[KINDS[kd]]||[];
  while(!list.length && kd>0){ kd--; list=G[KINDS[kd]]||[]; }      /* 그 단계 문항이 없으면 아래 단계로 */
  const tag=(subj==="과학"?"s":"")+KTAG[kd]+L+":";
  let idx=list.map((_,i)=>i).filter(i=>!used.has(tag+i));
  if(!idx.length){ [...used].filter(k=>k.startsWith(tag)).forEach(k=>used.delete(k)); idx=list.map((_,i)=>i); }
  const i=pickByPrio(idx, i=>genConceptName(L,kd,i,subj), subj, used, r);
  used.add(tag+i); used.add("c:"+genConceptName(L,kd,i,subj));
  return makeGenItem(subj,L,kd,i,r);
}

/* =========================================================
   v1.7 — 학습 지도(영역×학년) · 간격 복습 · 쌍둥이 문제 · 힌트 사다리 · 선수 개념 보강
   ========================================================= */
let ALLC=null;
function conceptBody(name,subj){
  if(SCI_CONCEPTS[name] && subj==="과학") return SCI_CONCEPTS[name][1];
  if(NEW_CONCEPT[name]) return NEW_CONCEPT[name];
  if(!ALLC){ ALLC=new Map(); [MATH_CONCEPTS,KOR_CONCEPTS,KOR_ITEM_CONCEPTS].forEach(l=>l.forEach(([re,n,b])=>{ if(!ALLC.has(n)) ALLC.set(n,b); })); }
  return ALLC.has(name) ? ALLC.get(name) : (SCI_CONCEPTS[name]?SCI_CONCEPTS[name][1]:null);
}
const DOMAINS={"수학":["수·연산","문자·식","함수·비례","도형·측정","확률·통계"],"국어":["어휘·맞춤법","문법","문학","읽기·쓰기"],"과학":["운동·에너지","물질","생명","지구·우주"]};
function domainOf(q,subj){
  if(typeof q.d==="number") return q.d;
  if(subj==="과학"){ const c=SCI_CONCEPTS[q.cn]; return c?c[0]:0; }
  if(subj==="국어"){ const n=conceptOf(q,subj).name;
    if(/소설|표현 방법|고전 문학/.test(n)) return 2;
    if(/높임|품사|문장 성분|음운|단어의 짜임|문장의 짜임|피동|선어말|부정 표현|문장의 종류|훈민정음|한글의 짜임|단모음|기본형/.test(n)) return 1;
    if(/설명·논증|글의 종류|발화의 의도|문장 부호/.test(n)) return 3;
    return 0; }
  const s=`${q.k||""} ${q.p||""}`;
  if(/삼각함수/.test(q.k||"")) return 2;
  if(/소인수분해|제곱근|근호|√/.test(s) && !/x|정사각형|함수/.test(s)) return 0;
  if((q.cn||conceptOf(q,subj).name)==="문장을 식으로 세우기") return 1;
  if(/확률|경우의 수|\dP\d|\dC\d|평균|중앙값|최빈값|분산|대푯값|뽑는/.test(s)) return 4;
  if(/삼각형|사각형|평행사변형|원의 넓이|부채꼴|각형|다면체|넓이|둘레|부피|직육면체|닮음|빗변|삼각비|sin|cos|tan|원주각|중심각|사이의 거리|cm|kg|시계|몇 시|시간|몇 분|몇 초|길이|무게|단위/.test(s)) return 3;
  if(/함수|정비례|반비례|기울기|절편|좌표|사분면|꼭짓점|점근선|lim|극한|미분|f′|∫|적분|로그|log|극솟값|극댓값|최솟값|지수방정식|ˣ|\^\(|비율|백분율|%|비례|\d : |규칙/.test(s)) return 2;
  if(/x|□|방정식|부등식|식의 값|인수분해|전개|계수|다항식|단항식|나눈 나머지|근|판별식|복소수|지수법칙|어떤 수|집합|수열|제\d+항|등차|등비|… \+/.test(s)) return 1;
  return 0;
}
function levelOfQ(q){
  if(typeof q.lv==="number") return q.lv;
  let m=/(\d+)-\d+$/.exec(q.bank||""); if(m) return +m[1];
  m=/^s?[ntdc](\d+):/.exec(q.gk||""); if(m) return +m[1];
  return null;
}
function cellState(c){ if(!c||!c.n) return "none"; const a=c.ok/c.n; return a<0.5?"weak" : (c.n>=2&&a>=0.75)?"done" : "doing"; }
const CELL_LAB={done:["●","c ok xl-good"],weak:["▲","c bad xl-bad"],doing:["○","c"],none:["·","c"]};
function mapCell(subj,L,d){ const c=((S.dmap||{})[subj]||{})[L+"|"+d], st=cellState(c); return {st, html:`${CELL_LAB[st][0]}${c&&c.n?` <small>${c.ok}/${c.n}</small>`:""}`, cls:CELL_LAB[st][1]}; }
function stopLine(subj){
  const dm=(S.dmap||{})[subj]||{}, D=DOMAINS[subj];
  if(!Object.keys(dm).length) return "아직 기록이 없습니다. 배치 검사나 점검 문서를 풀면 채워집니다.";
  let weakL=null, weak=[], top=-1;
  for(let L=0;L<=MAXL;L++) D.forEach((nm,d)=>{ const st=cellState(dm[L+"|"+d]);
    if(st==="weak"){ if(weakL==null) weakL=L; if(weakL===L) weak.push(nm); }
    if(st==="done") top=Math.max(top,L); });
  const topTxt = top>=0 ? ` 익힘이 확인된 가장 높은 곳은 ${LEVELS[top].grade}.` : "";
  return weakL!=null ? `여기서 멈췄습니다: ${LEVELS[weakL].grade} 「${weak.join(", ")}」.${topTxt}` : `아직 막힌 곳이 없습니다.${topTxt}`;
}

/* 생성기·은행 문항을 개념 이름으로 찾기 (간격 복습, 선수 개념 보강) */
const CONCEPT_INDEX={};
function conceptIndex(subj){
  if(CONCEPT_INDEX[subj]) return CONCEPT_INDEX[subj];
  const idx={}, push=(n,e)=>{ (idx[n]=idx[n]||[]).push(e); };
  for(let L=0;L<=MAXL;L++){
    if(subj!=="국어") KINDS.forEach((kn,kd)=>(gensOf(subj)[L][kn]||[]).forEach((_,i)=>push(genConceptName(L,kd,i,subj),{L,kd,i})));
    if(subj!=="수학") bankOf(subj)[L].forEach((_,k)=>push(korConceptName(L,k,subj),{L,bank:k}));
  }
  return CONCEPT_INDEX[subj]=idx;
}
/* 숫자 뒤 조사(을/를·와/과·은/는)와 ‘1x’ 표기를 바로잡음 */
function tidy(s){ return String(s).replace(/(^|[^\d.])1x/g,"$1x").replace(/(\d)(을|를|와|과|은|는)(?=[ ,])/g,(m,d,j)=>{ const bat="013678".includes(d), pair={"을":"을를","를":"을를","와":"과와","과":"과와","은":"은는","는":"은는"}[j]; return d+pair[bat?0:1]; }); }
function decorate(q,subj,L,kd,i){
  q.p=tidy(q.p); if(q.ex) q.ex=tidy(q.ex);
  q.gk=(subj==="과학"?"s":"")+KTAG[kd]+L+":"+i; q.lv=L; q.tier=kd;
  if(!q.cn) q.cn=genConceptName(L,kd,i,subj);
  if(typeof q.d!=="number") q.d=genDomain(L,kd,i,subj);
  return q;
}
function makeGenItem(subj,L,kd,i,r){ const list=gensOf(subj)[L][KINDS[kd]]; return decorate((list[i]||list[0])(r),subj,L,kd,i); }
function dueConcepts(subj){ const m=learnOf(subj), now=Date.now(); return Object.keys(m).filter(n=>m[n].due && m[n].due<=now).sort((a,b)=>m[a].due-m[b].due); }
function insertSpaced(subj,qs,r){
  const due=dueConcepts(subj); if(!due.length||!qs.length) return;
  const list=(conceptIndex(subj)[due[0]]||[]).filter(e=>e.bank!=null||e.kd<=1);
  if(!list.length){ learnOf(subj)[due[0]].due=0; return; }
  const e=list[Math.floor(r()*list.length)];
  const src=learnOf(subj)[due[0]].src;
  const q = src ? JSON.parse(JSON.stringify(src)) : (e.bank!=null ? korItem(e.L,e.bank,r,subj) : makeGenItem(subj,e.L,e.kd,e.i,r));
  q.spaced=true; q.gl="간격 복습"; qs[0]=q;
}
/* 오답 재검토용 쌍둥이 문제: 같은 생성기로 숫자만 바꿔 새로 냄(은행 문항은 보기 순서를 다시 섞음) */
function twinOf(q,subj,r){
  let m=/^(s?)([ntdc])(\d+):(\d+)$/.exec(q.gk||"");
  if(m){ const sj=m[1]?"과학":"수학", L=+m[3], kd=KTAG.indexOf(m[2]), i=+m[4], list=(gensOf(sj)[L]||{})[KINDS[kd]];
    if(list&&list[i]){ let n; for(let t=0;t<8;t++){ n=makeGenItem(sj,L,kd,i,r); if(n.p!==q.p) break; } return n; } }
  m=/^(과?)(\d+)-(\d+)$/.exec(q.bank||"");
  if(m){ const sj=m[1]?"과학":"국어", L=+m[2], k=+m[3]; if(bankOf(sj)[L]&&bankOf(sj)[L][k]) return korItem(L,k,r,sj); }
  const c=JSON.parse(JSON.stringify(q)); if(!c.cn) c.cn=conceptOf(q,subj).name; return c;
}
/* 힌트 사다리: 필요한 개념 → 첫걸음(또는 비슷한 예) → 풀이 */
function hintSteps(q,subj){
  const cs=conceptsOf(q,subj);
  const s1=`<span class="concept-h">힌트 1 · 필요한 개념${cs.length>1?` ${cs.length}가지`:""}</span>`+cs.map((c,k)=>`<b>${k?"함께 필요한 개념 · ":""}${esc(c.name)}</b><span class="concept-b">${esc(easyOf(c)[0]||"")}</span>`).join("");
  const exs=cs.map(c=>easyOf(c)[1]).filter(Boolean);
  const s2 = q.h ? `<span class="concept-h">힌트 2 · 첫걸음</span><span class="concept-b">${esc(q.h)}</span>`
    : exs.length ? `<span class="concept-h">힌트 2 · 비슷한 예</span>`+exs.map(e=>`<span class="concept-ex">예) ${esc(e)}</span>`).join("") : null;
  return s2?[s1,s2]:[s1];
}
function fmtSec(s){ s=Math.round(s); return s<60?`${s}초`:`${Math.floor(s/60)}분 ${s%60}초`; }
/* 두 건 연속 60% 미만일 때 제안하는 보강 문서: 최근 틀린 개념과 그 선수 개념을 아래 학년부터 */
function genPrereq(subj){
  const x=gradeOf(subj), Lcur = x.g===0 ? (x.step===3?1:0) : GRADES[x.g].lv[0];
  if(subj!=="수학"){ const d=genDoc(subj, Math.max(0,x.g-1), 3, true); d.support=true; d.title="선수 개념 보강"; d.offer={name:"기초 보강 교육",amount:priceOf(Math.max(0,x.g-1),1),tax:"비과세 · 교육훈련비",type:"support"}; save(); return d; }
  S.seq=(S.seq||0)+1; const r=rng((Date.now()^(S.seq*7919))>>>0), used=new Set();
  const names=[]; S.wrongLog.slice(-30).reverse().forEach(w=>{ const d=getDoc(w.docId); if(!d||d.subject!==subj||!d.qs[w.qi]) return; conceptsOf(d.qs[w.qi],subj).forEach(c=>{ if(!names.includes(c.name)) names.push(c.name); (PREREQ[c.name]||[]).forEach(p=>{ if(!names.includes(p)) names.push(p); }); }); });
  const idx=conceptIndex(subj), cands=[];
  names.forEach(n=>(idx[n]||[]).forEach(e=>{ if(e.bank==null && e.kd<=1 && e.L<=Lcur && e.L>=Lcur-2) cands.push({...e,n}); }));   /* 두 학년 아래까지만 */
  cands.sort((a,b)=>a.L-b.L);
  let qs=[]; const seen=new Set(), per={};
  for(const e of cands){ const key=e.L+":"+e.kd+":"+e.i; if(seen.has(key)||qs.length>=8||(per[e.n]||0)>=2) continue; seen.add(key); per[e.n]=(per[e.n]||0)+1; used.add(KTAG[e.kd]+e.L+":"+e.i); qs.push(makeGenItem(subj,e.L,e.kd,e.i,r)); }
  const Lb=Math.max(0,Lcur-1); while(qs.length<CONFIG.questionsPerDoc) qs.push(mathItemLearn(Lb,r,0,used,subj));
  qs.sort((a,b)=>a.lv-b.lv); const gl="선수 개념"; qs.forEach(q=>{ q.gl=gl; });
  const id="G"+S.seq, D=DEPTS[subj];
  const doc={id, subject:subj, view:D.view, gen:true, g:x.g, step:1, free:true, support:true, no:"보강-"+String(S.seq).padStart(4,"0"),
    file:`${D.name}_보강_${String(S.seq).padStart(4,"0")}.ksht`, title:"선수 개념 보강", level:`${GRADES[x.g].name} 이전 과정`, qs,
    offer:{name:"기초 보강 교육",amount:priceOf(Math.max(0,x.g-1),1),tax:"비과세 · 교육훈련비",type:"support"}};
  S.gen[id]=doc; save(); return doc;
}
function migrate(s){
  s.dmap=s.dmap||{}; s.pace=s.pace||{}; s.best=s.best||{};
  const now=Date.now(); Object.values(s.learn||{}).forEach(m=>Object.values(m).forEach(st=>{ if(st.ok>=LEARN_DONE && st.due===undefined){ st.stage=0; st.due=now+CONFIG.spacedDays[0]*86400000; } }));
  return s;
}
