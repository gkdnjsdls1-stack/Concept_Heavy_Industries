/* 엘리베이터 이동 → 해당 층 입장 */
function ride(target, then){
  const from=FLOOR_ORDER.indexOf(S.atFloor||"1F"), to=FLOOR_ORDER.indexOf(target);
  const done=()=>{ S.atFloor=target; S.lit=null; save(); beep(true); then(); };
  if(S.screen!=="lift" || reduce || from===to){ done(); return; }
  S.lit=target;
  document.querySelectorAll(".fb").forEach(x=>x.classList.toggle("lit", x.dataset.enter===target));
  const fl=document.getElementById("flr-"+target); fl&&fl.scrollIntoView({block:"center",behavior:"smooth"});
  const car=$("#car"); const dur=Math.min(1100, 260*Math.abs(to-from));
  if(car){ car.style.transition=`top ${dur}ms ease-in-out`; car.style.top=((BUILDING.length-1-to)*FH)+"px"; }
  setTimeout(done, dur+120);
}
function enterFloor(f){
  const b=BUILDING.find(x=>x.f===f); if(!b||b.closed) return;
  ride(f,()=>{
    if(b.key==="my") S.screen="my";
    else if(b.key==="wrong") S.screen="wrong";
    else if(b.key==="bank") S.screen="bank";
    else { S.screen="floor"; S.subject=b.key; S.free=null; newWorkbook(b.key); setSec(b.key,"main"); }
    save(); render(true);
  });
}

function post(key,label,amount,tax){

SCI_CONCEPTS["수권과 해수의 순환"]=[3,"지구의 물은 대부분 바닷물(해수)이고, 해수 1000 g에 녹아 있는 염류의 양(g)을 염분(‰)이라고 해요. 염분이 35‰이면 바닷물 1000 g에 염류 35 g이 들어 있어요."];

{ const humid=SCI_GEN[5].t2[1]; SCI_GEN[5].t2[1]=simSalt; SCI_GEN[6].t2.push(humid); }

const simOf=key=>{ const [id,i]=key.split(":"); const d=getDoc(id); return d&&d.qs[Number(i)]; };
function simInit(s){ return s.kind==="buoy"?{d:50}: s.kind==="ohm"?{v:0}: {c:s.l.concat(s.r).map(()=>1)}; }
function simCtl(q,key){ const s=q.sim, st=SIMST[key];
  if(s.kind==="buoy") return `<label class="sim-lab">블록 밀도 <b class="sim-v">${(st.d/100).toFixed(2)}</b> g/cm³<input type="range" min="10" max="200" step="5" value="${st.d}" data-simr="${key}" aria-label="블록 밀도"></label>`;
  if(s.kind==="ohm") return `<label class="sim-lab">전원 전압 <b class="sim-v">${st.v}</b> V<input type="range" min="0" max="36" step="0.5" value="${st.v}" data-simr="${key}" aria-label="전원 전압"></label>`;
  return "";
}
function simOut(q,key){ const s=q.sim, st=SIMST[key];
  if(s.kind==="buoy"){ const dk=st.d, lk=Math.round(s.liq*100), sink=dk>lk, frac=sink?1:dk/lk, wl=56, bh=40, top=sink?70:wl-bh*(1-frac);
    const label=sink?"가라앉음":`잠긴 부피 ${Math.round(frac*100)}%`;
    return `<svg viewBox="0 0 240 118" role="img" aria-label="부력 실험기"><rect x="10" y="18" width="220" height="92" fill="none" stroke="#5b6f84" stroke-width="2"/>
      <rect x="11" y="${wl}" width="218" height="${110-wl}" fill="${s.hide?"#cfe9e0":"#bfe3ee"}"/><line x1="11" y1="${wl}" x2="229" y2="${wl}" stroke="#2e86a8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="85" y="${top}" width="70" height="${bh}" fill="#b98a55" stroke="#7a5a33" stroke-width="2" opacity=".92"/>
      <text x="120" y="${top+bh/2+4}" font-size="11" text-anchor="middle" fill="#fff">${(dk/100).toFixed(2)}</text>
      <text x="16" y="34" font-size="11" fill="#34495e">${s.hide?"액체: 밀도 미지":"액체 밀도 "+s.liq+" g/cm³"}</text></svg><div class="sim-read">${label}</div>`; }
  if(s.kind==="ohm"){ const R=s.rs.reduce((a,b)=>a+b,0), I=Number((st.v/R).toFixed(2));
    const boxes=s.rs.map((r_,k)=>{ const x=s.rs.length===1?95:55+k*80; return `<rect x="${x}" y="12" width="50" height="16" fill="#fff" stroke="#34495e" stroke-width="2"/><text x="${x+25}" y="24" font-size="11" text-anchor="middle" fill="#34495e">${r_} Ω</text>`; }).join("");
    return `<svg viewBox="0 0 240 100" role="img" aria-label="회로 실험판"><path d="M24 20H220V80H24Z" fill="none" stroke="#5b6f84" stroke-width="2"/>${boxes}
      <rect x="14" y="40" width="20" height="24" fill="#f3f5f8" stroke="none"/><line x1="12" y1="46" x2="36" y2="46" stroke="#34495e" stroke-width="3"/><line x1="18" y1="56" x2="30" y2="56" stroke="#34495e" stroke-width="3"/>
      <text x="40" y="54" font-size="11" fill="#34495e">${st.v} V</text><circle cx="130" cy="80" r="14" fill="#fff" stroke="#0b8f8f" stroke-width="2.5"/><text x="130" y="85" font-size="14" text-anchor="middle" fill="#0b7f7f" font-weight="700">A</text></svg>
      <div class="sim-read">전류계 <b>${I}</b> A</div>`; }
  const all=s.l.concat(s.r), n=s.l.length, els=[...new Set(all.flatMap(f=>Object.keys(fAtoms(f))))];
  const cnt=side=>{ const o={}; (side?all.slice(n):all.slice(0,n)).forEach((f,k)=>{ const c=st.c[side?n+k:k]; for(const [e,m] of Object.entries(fAtoms(f))) o[e]=(o[e]||0)+m*c; }); return o; };
  const L=cnt(0), Rr=cnt(1), ok=els.every(e=>L[e]===Rr[e]);
  const chip=(f,k)=>`<span class="sim-sp"><button type="button" data-simc="${key}" data-simi="${k}" data-simd="-1" aria-label="${fSub(f)} 계수 줄이기">−</button><b>${st.c[k]}</b><button type="button" data-simc="${key}" data-simi="${k}" data-simd="1" aria-label="${fSub(f)} 계수 늘리기">＋</button><i>${fSub(f)}</i></span>`;
  return `<div class="sim-eq">${s.l.map((f,k)=>chip(f,k)).join('<em>+</em>')}<em>→</em>${s.r.map((f,k)=>chip(f,n+k)).join('<em>+</em>')}</div>
    <div class="sim-cnt">${els.map(e=>`<span class="${L[e]===Rr[e]?"eq":"ne"}">${e} ${L[e]} : ${Rr[e]}</span>`).join("")}</div><div class="sim-read ${ok?"ok":""}">${ok?"✔ 양쪽 원자 수가 같습니다":"원자 수가 아직 다릅니다"}</div>`;
}
function simHtml(q,docId,i){ const key=docId+":"+i; if(!SIMST[key]) SIMST[key]=simInit(q.sim);
  return `<div class="sim" data-simk="${key}"><div class="sim-h">첨부 · 시뮬레이션</div>${simCtl(q,key)}<div class="sim-out">${simOut(q,key)}</div></div>`; }
document.addEventListener("input",e=>{ const r=e.target.closest&&e.target.closest("[data-simr]"); if(!r) return;
  const key=r.dataset.simr, q=simOf(key), st=SIMST[key]; if(!q) return; const v=Number(r.value);
  if(q.sim.kind==="buoy") st.d=v; else st.v=v;
  const box=r.closest(".sim"); box.querySelector(".sim-v").textContent = q.sim.kind==="buoy"?(v/100).toFixed(2):v; box.querySelector(".sim-out").innerHTML=simOut(q,key); });
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-simc]"); if(!b) return;
  const key=b.dataset.simc, q=simOf(key), st=SIMST[key]; if(!q) return; const k=Number(b.dataset.simi);
  st.c[k]=Math.max(1,Math.min(9,st.c[k]+Number(b.dataset.simd)));
  b.closest(".sim").querySelector(".sim-out").innerHTML=simOut(q,key); });

/* 7F 과학실험과 — 칼퇴파인(에듀파인풍 업무포털) + 시험·실험 의뢰서 / 실험일지 */
function sciDoc(doc,ds,o){
  const subj=doc.subject, dept=DEPTS[subj], name=S.name||"신입사원", cur=nextRow(doc,ds), upto=revealUpTo(doc,ds), blind=isBlind(doc,ds);
  const hold=blind||doc.placement, done=!!ds.completedAt, all=allSubmitted(doc,ds);
  const date=docDate(ds.startedAt), serial=docSerial(doc);
  let prev="";
  const rows=doc.qs.map((q,i)=>{
    if(i>upto) return "";
    const a=ds.answers[i], locked=isLocked(doc,a,q), st=rowStatus(ds,i);
    const res = hold ? (a?"접수":"대기") : ({ok:"적합",bad:"부적합",pend:"대기"})[st];
    const cell = locked ? (a?`<span class="gd-reply">${esc(replyText(q,a))}</span>`:"") : answerCell(doc,ds,i);
    const kind = q.t==="choice" ? "obs" : "mea";
    const sec = kind!==prev ? `<tr class="sc-sec"><td colspan="5">${kind==="obs"?"▍ 시험항목 · 관찰과 이해":"▍ 실험일지 · 측정과 계산"}</td></tr>` : "";
    prev=kind;
    return `${sec}<tr id="row-${i}" class="${i===cur?"cur":""}"><td class="c">${i+1}</td><td class="c wo-col-g">${esc(gubun(doc,q,i))}</td>
      ${q.t==="choice"||q.sim?`<td class="gd-q" colspan="2">${esc(q.p)}<span class="gd-g-m">${esc(gubun(doc,q,i))}</span>${q.sim?simHtml(q,doc.id,i):choiceButtons(doc,ds,i)}<div class="ch-ans">${cell}</div></td>`
        :`<td class="gd-q">${esc(q.p)}<span class="gd-g-m">${esc(gubun(doc,q,i))}</span></td><td class="c gd-ans">${cell}</td>`}
      <td class="c wo-res ${hold?"":st}">${res}${hold?"":resLink(doc,ds,i)}</td></tr>${noteRow(doc,ds,i,5)}`;
  }).join("");
  // 문서 머리: officialDoc 은 title/lead/status, workOrder 계열은 kind/info/notes
  let title, info, notes;
  if(o.info){
    title = doc.placement ? "배치 시험 의뢰서" : doc.exam ? "승진 시험 의뢰서" : (doc.free ? "특별 시험 의뢰서" : "시험·실험 의뢰서");
    info = o.info; notes = o.notes||[];
  } else {
    title = doc.review ? "재시험 의뢰서" : "시험·실험 의뢰서";
    info = [[["문서번호",esc(`${dept.org}-${serial}`)],["의뢰일자",date.replace(/\. /g,"-").replace(/\.$/,"")]],
            [["의뢰기관","칼퇴특별자치도교육청"],["시험자",`${esc(companyRank())} ${esc(name)}`]]];
    notes = [o.lead].concat(o.status||[]);
  }
  const stamp=t=>`<span class="stamp">${esc(t)}</span>`;
  const menu=["의뢰함","시험 진행","성적서 발급","재시험","시약·장비실"], on = doc.review?3:1;
  return `<article class="wo sc" aria-label="${esc(title)}">
    <div class="sc-top"><span class="sc-logo">칼퇴<b>파인</b></span><span class="sc-org">${esc(dept.org)} · 과학탐구지원단</span><span class="sc-user">${esc(name)}</span></div>
    <div class="sc-menu" aria-hidden="true">${menu.map((m,k)=>`<span class="${k===on?"on":""}">${m}</span>`).join("")}</div>
    <div class="sc-crumb">업무포털 › 시험·실험 의뢰 › ${esc(title)}</div>
    <div class="sc-head"><h2>${esc(title)}</h2>
      <table class="wo-appr" aria-label="결재"><tr><th rowspan="2" class="v">결<br>재</th><th>담당</th><th>팀장</th><th>단장</th></tr>
      <tr><td>${all?stamp(companyRank()):""}</td><td>${done?stamp("검토"):""}</td><td>${done?stamp("승인"):""}</td></tr></table></div>
    <table class="wo-info">${info.map(r=>`<tr>${r.map(([k,v])=>`<th>${esc(k)}</th><td>${v}</td>`).join("")}</tr>`).join("")}</table>
    ${notes.length?`<ul class="sc-notes">${notes.map(n=>`<li>${typeof n==="string"?n:""}</li>`).join("")}</ul>`:""}
    <div class="sc-secbar">시험·실험 항목</div>
    <div class="gd-tablewrap"><table class="gd-t wo-t sc-t"><thead><tr><th class="w-no">No</th><th class="w-g wo-col-g">구분</th><th>시험·실험 내용</th><th class="w-a">결과 입력</th><th class="w-r">판정</th></tr></thead>
    <tbody>${rows}${upto<doc.qs.length-1&&!doc.placement?`<tr class="gd-more"><td colspan="5">남은 항목 ${doc.qs.length-upto-1}건</td></tr>`:""}</tbody></table></div>
    ${o.actions||""}
    <div class="wo-foot"><span>문서번호 ${esc(dept.org)}-${esc(serial)}</span><span>칼퇴파인 v2.4</span><span>내부망 전용</span></div>
  </article>`;
}

/* 사내 작업지시서 (개념중공업 전자결재) */

  const upto=revealUpTo(doc,ds);
  const rows=doc.qs.map((q,i)=>{ if(i>upto) return ""; const a=ds.answers[i], locked=isLocked(doc,a,q), st=rowStatus(ds,i);
    const res = blind ? (a?"접수":"대기") : (doc.placement ? (a?"접수":"대기") : lab(st));
    const cell = locked ? `<span class="gd-reply">${esc(replyText(q,a))}</span>` : answerCell(doc,ds,i);

        :`<td class="gd-q">${esc(q.p)}<span class="gd-g-m">${esc(gubun(doc,q,i))}</span></td>
      <td class="c gd-ans">${cell}</td>`}<td class="c wo-res ${blind||doc.placement?"":st}">${res}${blind||doc.placement?"":resLink(doc,ds,i)}</td></tr>${noteRow(doc,ds,i,5)}`; }).join("");

    <div class="wo-head"><h2>${esc(o.kind)}</h2>
      <table class="wo-appr" aria-label="결재"><tr><th rowspan="2" class="v">결<br>재</th><th>담당</th><th>${esc(o.lead2||"팀장")}</th><th>${esc(o.lead3||"본부장")}</th></tr>
      <tr><td>${all?stamp(companyRank()):""}</td><td>${done?stamp("검토"):""}</td><td>${done?stamp("승인"):""}</td></tr></table></div>
    <table class="wo-info">${o.info.map(r=>`<tr>${r.map(([k,v])=>`<th>${esc(k)}</th><td>${v}</td>`).join("")}</tr>`).join("")}</table>
    <div class="wo-sec">작업 내역</div>
    <table class="gd-t wo-t"><thead><tr><th class="w-no">No</th><th class="w-g wo-col-g">구분</th><th>작업 내용</th><th class="w-a">결과 입력</th><th class="w-r">검사</th></tr></thead><tbody>${rows}${upto<doc.qs.length-1&&!doc.placement?`<tr class="gd-more"><td colspan="5">남은 문항 ${doc.qs.length-upto-1}건</td></tr>`:""}</tbody></table>
    ${o.actions||""}
    <div class="wo-foot"><span>문서번호 ${esc(o.docno)}</span><span>보존기간 1년</span><span>사내 한정</span></div>

/* 정규·특근·재검토 문서 */

  if(doc.review){
    return officialDoc(doc,ds,{title:`[재검토] ${kind} 역량 점검 오답 문항 재회신 요청`,
      lead:`오답 정리부에 등재된 문항을 아래와 같이 다시 송부하오니 회신하여 주시기 바랍니다.`,

            [["작업구분",`<b>${esc(doc.offer.name)}</b> (${doc.support?"교육":"특근"})`],["업무 수준",esc(doc.level||"")]],[["수당",`<b>${won(doc.offer.amount)}</b> · ${esc(doc.offer.tax)}`],["지급","처리 즉시 개념은행 입금(가상)"]]],
      notes:["특근은 정규 실적·호봉에 반영되지 않습니다.","결과 입력 후 ‘점검 종료 및 결과 보고’를 누르면 수당이 지급됩니다."], actions:docActions(doc,ds)});

    const a=ds.answers[i], locked=isLocked(doc,a,q)||viewOnly, st=rowStatus(ds,i);
    const sel=ds.draft[i]??a?.resp;

/* 생성 문서: 수학은 생성기, 국어는 문항 은행에서 */
function bankPick(subj,L,r,picked,usedC){
  const used=S.usedBank, BK=bankOf(subj), inDoc=(lv,k)=>picked.some(p=>p&&p[0]===lv&&p[1]===k);
  /* 그 수준 문항을 한 바퀴 다 풀었으면 그 수준만 다시 섞어 처음부터 (다른 수준으로 새지 않게) */
  let free_=BK[L].map((_,k)=>k).filter(k=>!used[bkey(subj,L,k)] && !inDoc(L,k));
  if(!free_.length){ BK[L].forEach((_,k)=>{ delete used[bkey(subj,L,k)]; }); free_=BK[L].map((_,k)=>k).filter(k=>!inDoc(L,k)); }
  let got = free_.length ? [L, pickByPrio(free_, k=>korConceptName(L,k,subj), subj, usedC, r)] : null; if(got) usedC.add("c:"+korConceptName(L,got[1],subj));
  for(let d=1; !got && d<=MAXL; d++){ for(const lv of [L-d,L+d]){ if(got||lv<0||lv>MAXL) continue;
    const f2=BK[lv].map((_,k)=>k).filter(k=>!inDoc(lv,k)); if(f2.length) got=[lv,f2[Math.floor(r()*f2.length)]]; } }
  return got;
}
function genDoc(subj,g,step,free){

    for(let i=0;i<N_;i++){ const q=mathItemLearn(contentLv(g,step,r),r,kinds[i]||0,used,subj); q.gl=gl; qs.push(q); }

    for(let i=0;i<N_-calc.length;i++) picked.push(bankPick(subj,contentLv(g,step,r),r,picked,usedC));
    qs=picked.filter(Boolean).map(([lv,k])=>{ const q=korItem(lv,k,r,subj); q.gl=gl; return q; }).concat(calc);

/* =========================================================
   적성 배치 검사 — 문항반응이론(Rasch형) 적응형
   ========================================================= */
const GRID=[]; for(let t=-1; t<=MAXL+1.001; t+=0.1) GRID.push(+t.toFixed(1));
/* 4모수형: 찍어서 맞힐 확률(객관식 c)과 아는데 실수할 확률(1-d)을 반영 → 한 번 틀려도 크게 깎이지 않음 */
function pCorrect(theta,lv,t){ const c = t==="choice" ? CONFIG.irtGuess : 0, d = CONFIG.irtCeil;
  return c + (d-c) / (1+Math.exp(-CONFIG.irtA*(theta-(lv-0.25)))); }
function eap(items,answers){
  const w=GRID.map(t=>{ let v=Math.exp(-0.5*((t-CONFIG.placeStart)/CONFIG.placePriorSd)**2);
    items.forEach((it,i)=>{ const a=answers[i]; if(!a) return; const p=pCorrect(t,it.lv,it.t); v*= a.correct? p : (1-p); }); return v; });
  const z=w.reduce((x,y)=>x+y,0)||1; const m=GRID.reduce((acc,t,i)=>acc+t*w[i],0)/z;
  const sd=Math.sqrt(GRID.reduce((acc,t,i)=>acc+(t-m)**2*w[i],0)/z); return {m,sd};
}
function plItem(subj,L,usedIdx){
  const r=rng((Date.now()^Math.floor(Math.random()*1e9))>>>0);
  /* 영역이 한쪽으로 쏠리지 않게: 지금까지 가장 덜 물어본 영역의 문항부터 */
  const items=(S.pl[subj]||{}).items||[], cnt={}; items.forEach(z=>{ const d=domainOf(z,subj); cnt[d]=(cnt[d]||0)+1; });
  const least=(cands,domOf)=>{ let best=Infinity,pool=[]; cands.forEach(c=>{ const n=cnt[domOf(c)]||0; if(n<best){ best=n; pool=[c]; } else if(n===best) pool.push(c); }); return pool[Math.floor(r()*pool.length)]; };
  if(subj==="수학"){ const used=new Set(items.map(z=>z.gk).filter(Boolean)), list=MATH_GEN[L].norm;
    let idx=list.map((_,i)=>i).filter(i=>!used.has("n"+L+":"+i)); if(!idx.length) idx=list.map((_,i)=>i);
    const i=least(idx,i=>genDomain(L,0,i,subj)); const q=makeGenItem(subj,L,0,i,r); q.k="검사 항목"; return q; }
  const BK=bankOf(subj);
  for(let d=0; d<=MAXL; d++){ for(const lv of (d?[L-d,L+d]:[L])){ if(lv<0||lv>MAXL) continue;
    const free=BK[lv].map((_,i)=>i).filter(i=>!usedIdx.includes(bkey(subj,lv,i)));
    if(free.length){ const k=least(free,k=>domainOf({p:BK[lv][k].p,cn:BK[lv][k].cn},subj)); const q=korItem(lv,k,r,subj); q.lv=lv; q.k="검사 항목"; return q; } } }
}
/* 배치고사에서 틀린 문항을 오답노트로 (검사는 다시 볼 수 있으니 틀린 문항만 따로 보관) */
function archivePlacementWrong(subj){
  const pl=S.pl[subj], ds=S.docs["PL-"+subj]; if(!pl||!pl.done||pl.archived||!ds) return;
  const wrong=pl.items.map((q,i)=>[q,i]).filter(([q,i])=>ds.answers[i] && !ds.answers[i].correct);
  pl.archived=true; if(!wrong.length) return;
  S.seq=(S.seq||0)+1; const id="P"+S.seq;
  const qs=wrong.map(([q])=>{ const c=JSON.parse(JSON.stringify(q)); c.k="배치고사"; delete c.bank; return c; });
  S.gen[id]={id, subject:subj, view:DEPTS[subj].view, archived:true, no:"배치-"+String(S.seq).padStart(4,"0"), title:"적성 배치 검사 오답", level:"배치고사", qs};
  S.docs[id]={answers:Object.fromEntries(wrong.map(([q,i],k)=>[k,{...ds.answers[i]}])), draft:{}, startedAt:pl.startedAt||Date.now(), completedAt:Date.now(), scrollY:null};
  wrong.forEach(([q,i],k)=>S.wrongLog.push({docId:id, qi:k, resp:ds.answers[i].resp, at:Date.now(), from:"placement"}));
}
function plStart(subj){
  S.pl[subj]={items:[], done:false, startedAt:Date.now()}; delete S.docs["PL-"+subj];
  S.pl[subj].items.push(plItem(subj, Math.round(CONFIG.placeStart), [])); save();
}
function plAfterAnswer(subj){
  const pl=S.pl[subj], ds=docState("PL-"+subj), n=pl.items.length;
  const {m,sd}=eap(pl.items, ds.answers);
  pl.theta=m; pl.sd=sd;
  const top = m>MAXL-0.2 && sd<0.8, bottom = m<0.2 && sd<0.8;
  if((n>=CONFIG.placeMin && (sd<CONFIG.placeStopSd || top || bottom)) || n>=CONFIG.placeMax){
    pl.done=true; pl.est=Math.max(0,Math.min(MAXL,Math.floor(m+0.25))); pl.n=n; archivePlacementWrong(subj);
    pl.ok=pl.items.filter((_,i)=>ds.answers[i]?.correct).length; save(); render(false); showPlacementResult(subj); return;
  }
  const next=Math.max(0,Math.min(MAXL,Math.round(m)));
  pl.items.push(plItem(subj,next,pl.items.map(q=>q.bank).filter(Boolean))); save();
}

function josa(w){ const c=w.charCodeAt(w.length-1)-44032; return c>=0&&c<11172&&(c%28)!==0&&(c%28)!==8; }
function gradeChoices(g,step){
  return `<button class="btn primary" style="width:100%" data-pick="${g}" data-step="${step}">${esc(gradeLabelOf(g,step))}${josa(gradeLabelOf(g,step))?"으로":"로"} 시작</button>
    ${g>0?`<div class="pick-grid" style="margin-top:12px">${
      GRADES.slice(0,g).map((G,i)=>`<button class="btn" data-pick="${i}" data-step="1">${esc(G.name)} 1호봉<small>${esc(G.school)}</small></button>`).reverse().join("")}</div>`:""}`;
}
function showPlacementResult(subj){
  const pl=S.pl[subj], [g,step]=L2G[pl.est], dept=DEPTS[subj];
  const acc = pl.sd<0.5?"높음":pl.sd<0.75?"보통":"낮음";
  showModal(`<div class="nt-h">배치 결과 통지</div>
    <p class="nt-to">${esc(dept.floor)} ${esc(dept.name)} · ${esc(companyRank())} ${esc(S.name||"신입사원")}</p>
    <div class="nt-rank"><small>배치 급·호봉</small><b>${esc(gradeLabelOf(g,step))}</b><span>${esc(GRADES[g].school)} 수준 업무</span></div>
    <p class="nt-meta">검사 ${pl.n}건 · 적정 ${pl.ok}건 · 추정 정확도 ${acc}</p>
    <p style="margin:0 0 8px;font-size:14px;font-weight:700">${esc(stopLine(subj))}</p>
    <details class="sol" style="margin:0 0 12px"><summary>학년 × 영역 지도 보기</summary>${mapMini(subj)}</details>
    ${gradeChoices(g,step)}`);
}
function pickLevel(subj,g,step){
  const pl=S.pl[subj];
  S.grade[subj]={g,step}; S.placed[subj]={est:pl&&pl.done?pl.est:null, g, step, n:pl?pl.items.length:0, at:Date.now(), skipped:!(pl&&pl.done)};
  S.stepDocs=S.stepDocs||{}; S.examReady=S.examReady||{}; S.stepDocs[subj]=0; S.examReady[subj]=false; S.cur[subj]=null; S.free=null; closeModal(); save(); render(true); window.scrollTo(0,0);
  toast(`${DEPTS[subj].name} ${gradeLabelOf(g,step)} 배치`);
}

let activeDocId=null;
/* 객관식은 정식·특근 문서에서 한 번 틀리면 닫힘(재도전은 오답노트에서), 풀이를 연 문항도 닫힘 */
function isLocked(doc,a,q){ return a && (a.correct || doc.placement || doc.exam || a.gaveUp || (!!q && q.t==="choice" && !doc.review)); }
function isBlind(doc,ds){ return (doc.placement||doc.exam) && !ds.completedAt; }
function answerCell(doc,ds,i){
  const q=doc.qs[i], a=ds.answers[i], locked=isLocked(doc,a,q);
  if(q.t==="choice"){
    const sel = ds.draft[i] ?? (a?a.resp:null);
    return `<div class="ans"><button class="btn-s wide" data-submit="${i}" ${locked||sel==null?"disabled":""}>${locked?"회신 완료":"회신"}</button></div>`;
  }
  const val = ds.draft[i] ?? (a?a.resp:"");
  const im = q.t==="num" ? 'inputmode="numeric"' : 'inputmode="text"';
  return `<div class="ans"><label class="sr" for="in-${doc.id}-${i}">${i+1}번 회신</label>
    <input id="in-${doc.id}-${i}" data-input="${i}" ${im} autocomplete="off" enterkeyhint="next" value="${esc(val)}" ${locked?"disabled":""}>
    ${locked?"":`<button class="btn-s" data-submit="${i}" aria-label="${i+1}번 회신">회신</button>`}</div>`;
}
function choiceButtons(doc,ds,i){
  const q=doc.qs[i]; if(q.t!=="choice") return "";
  const a=ds.answers[i], locked=isLocked(doc,a,q), sel=ds.draft[i] ?? (a?a.resp:null);
  return `<div class="choices" role="group" aria-label="${i+1}번 보기">${q.c.map((c,j)=>
    `<button class="choice" data-choice="${i}" data-val="${j}" aria-pressed="${sel===j}" ${locked?"disabled":""}>${"①②③④⑤"[j]} ${esc(c)}</button>`).join("")}</div>`;
}
function noteRow(doc,ds,i,cols){
  const q=doc.qs[i], a=ds.answers[i]; if(!a) return "";
  if(doc.placement||doc.exam||doc.archived) return "";
  if(!doc.review){                          // 정식·특근 문서: 틀린 문항에만 힌트 사다리(개념 → 첫걸음 → 풀이)
    const lv=(ds.hint||{})[i]||0;
    if(a.firstCorrect || (a.correct && !lv)) return "";
    const steps=hintSteps(q,doc.subject), solved=lv>steps.length;
    const shown=steps.slice(0,Math.min(lv,steps.length)).map(s=>`<div class="concept">${s}</div>`).join("");
    const sol=solved?`<div class="sol-body"><span class="note-h">풀이</span>정답은 <b>${esc(answerLabel(q))}</b>. ${esc(q.ex)}${q.kn?`<span class="ext">참고: ${esc(q.kn)}</span>`:""}</div>`:"";
    const lead=lv===0&&!a.correct ? `<span class="note-h">재검토</span>${q.t==="choice"?"객관식은 이 문서에서 다시 고를 수 없습니다. 오답노트에서 다시 도전하세요. ":"답을 고쳐 다시 회신할 수 있습니다. 막히면 힌트를 한 단계씩 여세요. "}` : "";
    const btn=a.correct||solved ? "" : `<button class="linkbtn sol-btn" data-hint="${i}">${lv<steps.length?`힌트 ${lv+1} 보기`:"풀이 보기 (이 문항은 닫힙니다)"}</button>`;
    return `<tr class="note"><td colspan="${cols}"${cols===5?' style="border:1px solid var(--grid)"':""}>${lead}${shown}${sol}${btn}</td></tr>`;
  }
  const open = !a.correct || ds.open?.[i];
  if(!open) return "";
  const head = "";
  const shown = a.correct || ds.sol?.[i];   // 틀린 문항은 개념만, 풀이는 요청할 때만
  const sol = shown
    ? `<div class="sol-body"><span class="note-h">풀이</span>${a.correct?"":`정답은 <b>${esc(answerLabel(q))}</b>. `}${esc(q.ex)}${q.kn?`<span class="ext">참고: ${esc(q.kn)}</span>`:""}</div>`
    : `<button class="linkbtn sol-btn" data-sol="${i}">풀이 보기</button>`;
  return `<tr class="note"><td colspan="${cols}"${cols===5?' style="border:1px solid var(--grid)"':""}>${conceptsHtml(q,doc.subject)}${sol}</td></tr>`;
}
function resLink(doc,ds,i){ const a=ds.answers[i]; return doc.review&&a&&a.correct&&!ds.open?.[i]&&(!isBlind(doc,ds)) ? `<button class="linkbtn" data-open="${i}">해설</button>` : ""; }
function resCell(doc,ds,i){
  const st=rowStatus(ds,i);
  if(doc.placement && !ds.completedAt) return ds.answers[i]?`<span class="st ok" style="background:#eef1f5;color:#444">접수</span>`:`<span class="st pend">검토 중</span>`;
  return `<span class="st ${st}">${statusLabel(st)}</span>${resLink(doc,ds,i)}`;
}

function docActions(doc,ds){
  if(ds.completedAt) return reportBlock(doc,ds);
  const can=allSubmitted(doc,ds);
  if(doc.exam) return `<div class="actions"><button class="btn primary" data-act="exam-grade" ${can?"":"disabled"}>답안 제출 및 채점</button></div>`;
  if(doc.placement) return `<div class="actions"><button class="btn primary" data-act="report" ${can?"":"disabled"}>검사 종료 및 배치 결과 보기</button></div>
    <p class="hint"><button class="linkbtn" data-act="skip-place">검사 없이 처음부터 시작</button></p>`;
  return `<div class="actions"><button class="btn primary" data-act="report" ${can?"":"disabled"}>점검 종료 및 결과 보고</button></div>`;
}
function reportBlock(doc,ds){
  const n=doc.qs.length, ok=doc.qs.filter((_,i)=>ds.answers[i]?.correct).length;
  const first=doc.qs.filter((_,i)=>ds.answers[i]?.firstCorrect).length;
  const mins=Math.max(1,Math.round((ds.completedAt-ds.startedAt)/60000));
  if(doc.exam) return examReport(doc,ds);
  const ti=ds.timeInfo, hintN=doc.qs.filter((_,i)=>ds.answers[i]?.hint).length;
  const school = doc.gen&&typeof doc.g==="number"&&!doc.support ? GRADES[doc.g].school : "";
  const timeLine = ti ? `<p style="margin:0 0 10px;font-size:14px">${school?`${esc(school)} 과정 `:""}${n}문항을 <b>${fmtSec(ti.sec)}</b>에 풀었습니다(문항당 ${fmtSec(ti.sec/n)})${ti.record?(ti.prev?` · <b>${esc(GRADES[doc.g].name)} 최고 기록 경신</b> (이전 ${fmtSec(ti.prev)})`:` · ${esc(GRADES[doc.g].name)} 첫 기록`):(ti.prev?` · ${esc(GRADES[doc.g].name)} 최고 기록 ${fmtSec(ti.prev)}`:"")}${hintN?` · 힌트 사용 ${hintN}문항`:""}.</p>` : (hintN?`<p style="margin:0 0 10px;font-size:14px">힌트 사용 ${hintN}문항.</p>`:"");
  const paceLine = ds.pace==="up" ? `<p style="margin:0 0 10px;font-size:14px"><b>첫 회신 만점 ${CONFIG.paceRun}건 연속</b> — 이 급은 충분해 보입니다. 승진 시험을 권합니다.</p>`
    : ds.pace==="down" ? `<p style="margin:0 0 10px;font-size:14px"><b>첫 회신 ${Math.round(CONFIG.paceLowRate*100)}% 미만 ${CONFIG.paceRun}건 연속</b> — 앞 단계 개념부터 다지는 편이 빠릅니다. <button class="linkbtn" data-act="prereq">선수 개념 보강 문서 받기</button></p>` : "";
  const isReg=!S.free && !doc.free && !doc.review, dept=DEPTS[doc.subject], subj=doc.subject;
  const ev=ds.evalInfo, ready=gradeOf(subj).g<MAXG;
  const nr=nextRankInfo();
  const sciRep = subj==="과학" && !doc.placement;
  return `<section class="report${sciRep?" sc-rep":""}" aria-label="${sciRep?"시험성적서":"결과 보고"}">
    <h3>${sciRep?`시험성적서 · ${esc(doc.no)}<span class="sc-judge ${ok===n?"ok":"bad"}">${ok===n?"전 항목 적합":`부적합 ${n-ok}건`}</span>`:`결과 보고 · ${esc(doc.no)}`}</h3>
    <div class="kv"><div><b class="num">${ok}/${n}</b><span>최종 적정</span></div><div><b class="num">${first}/${n}</b><span>첫 회신 적정</span></div><div><b class="num">${ti?fmtSec(ti.sec):mins+"분"}</b><span>${ti?"풀이 시간":"소요"}</span></div></div>
    ${timeLine}${paceLine}<p style="margin:0 0 10px;font-size:14px">${isReg ? (ds.creditedNow?`근무 실적 1건 인정 · 누계 ${S.workUnits}건${nr?` · ${esc(nr.name)} 승진까지 ${nr.need}건`:""}.`:"") : doc.review ? "" : (doc.offer ? `${esc(doc.offer.name)} 수당 <b>${won(doc.offer.amount)}</b> 입금` : "")}
    ${n-ok&&!doc.review?` · 오답 ${n-ok}건`:""}</p>
    ${isReg&&ev?`<p style="margin:0 0 10px;font-size:14px;border-top:1px dashed #999;padding-top:8px"><b>호봉 평정</b> · 첫 회신 ${ev.first}/${ev.n}(${Math.round(ev.first/ev.n*100)}%) — 기준 ${Math.round(CONFIG.passRate*100)}% ${ev.pass?"충족":"미달"} → <b>${esc(ev.msg)}</b> · 현재 ${esc(gradeLabel(subj))}, 호봉 실적 ${Math.min(S.stepDocs[subj]||0,CONFIG.docsPerStep)}/${CONFIG.docsPerStep}</p>`:""}
    <div class="actions" style="margin-top:0">
      ${isReg ? `<button class="btn primary" data-act="next">다음 작업지시서 받기</button>${ready?`<button class="btn" data-act="exam">다 알아요 · 승진 시험 보기</button>`:""}`
              : doc.review ? `<button class="btn primary" data-act="to-wrong">${doc.subject==="수학"?"오답 정리부로":"오답노트로"}</button>`
              : `<button class="btn primary" data-act="floor-list">자유 점검으로</button><button class="btn" data-act="back-regular">정식 점검으로</button>`}
    </div></section>`;
}

function renderFloor(){
  const subj=S.subject, dept=DEPTS[subj];
  if(!S.free && !S.placed[subj]) return renderPlacement(subj);
  const sec=secOf(subj), sheet=dept.view==="sheet";
  if(!S.free && sec!=="main") return renderSection(subj,sec);
  const id=S.free || ((S.viewSheet && getDoc(S.viewSheet)) ? S.viewSheet : openDocId());
  const doc=getDoc(id), ds=docState(id); activeDocId=id;
  if(sheet) return renderSheet(doc,ds);
  const pre = "";
  return gdTabs(subj) + pre + renderOrder(doc,ds);
}

function renderBar(){

  bar.hidden=false;
  const loc = S.screen==="my" ? ["8F","인사총무팀 · 마이페이지"] : S.screen==="bank" ? ["1F","개념은행"] : (S.screen==="wrong"||S.screen==="wrongdoc") ? ["2F","품질관리실 · 오답노트"] : [DEPTS[S.subject].floor, DEPTS[S.subject].name+(S.free?(getDoc(S.free)&&getDoc(S.free).exam?" · 승진 시험":getDoc(S.free)&&getDoc(S.free).review?" · 오답 재검토":" · 특별근무"):S.placed[S.subject]?" · "+gradeLabel(S.subject):" · 배치 중")];
  $("#loc").innerHTML=`<small>${esc(loc[0])}</small>${esc(loc[1])}`;
  $("#who").textContent=companyRank();

let tickDoc=null;
function render(restore){
  renderBar(); markFloorHistory();
  const m=$("#main");
  if(S.screen==="lift"){ activeDocId=null; m.className="full"; m.innerHTML=renderBuilding();
    if(restore) requestAnimationFrame(()=>{ const el=document.getElementById("flr-"+(S.atFloor||"1F")); el&&el.scrollIntoView({block:"center"}); });
    return; }
  m.className="";
  m.innerHTML = S.screen==="my" ? renderMy() : S.screen==="bank" ? renderBank() : S.screen==="wrong" ? renderWrongFloor() : S.screen==="wrongdoc" ? renderReviewDoc() : renderFloor();
  const id=activeDocId;
  if(id!==tickDoc){ tickDoc=id; if(id) docState(id).tick=Date.now(); }
  if(restore){
    if(id){ const ds=docState(id);
      requestAnimationFrame(()=>{ if(ds.scrollY!=null) window.scrollTo(0,ds.scrollY);
        else { const r=nextRow(getDoc(id),ds); const el=r>0&&document.getElementById("row-"+r); if(el) el.scrollIntoView({block:"center"}); else window.scrollTo(0,0); } });
    } else window.scrollTo(0,0);
  }

function doReport(){

function genExam(subj){

    else if(subj==="과학" && i>=CONFIG.examSize-4 && SCI_GEN[L].think.length) q=mathItemLearn(L,r,i%2?2:3,used,subj);
    else { const BK=bankOf(subj), free_=BK[L].map((_,k)=>k).filter(k=>!qs.some(z=>z.bank===bkey(subj,L,k)));
      const k=pickByPrio(free_.length?free_:BK[L].map((_,k)=>k), k=>korConceptName(L,k,subj), subj, usedC, r); usedC.add("c:"+korConceptName(L,k,subj)); q=korItem(L,k,r,subj); }
    q.gl=`${G.name} 단원 종합`; qs.push(q); }
  const id="E"+S.seq;
  S.gen[id]={id, subject:subj, view:"order", exam:true, unit:true, fromG:x.g, toG:Math.min(MAXG,x.g+1), no:"승진-"+String(S.seq).padStart(4,"0"), title:`${G.name} 단원 종합 · ${N.name} 승진 시험`, level:`${G.name} · ${G.school} 단원 (${subj==="수학"?"결합·도전 문제":"단원 종합"})`, qs};
  save(); return id;
}
function startExam(){ saveScroll(); const sj=S.subject; S.exams=S.exams||{};
  let id=S.exams[sj]; const d=id&&getDoc(id); if(!d||!d.unit||d.fromG!==gradeOf(sj).g||S.docs[id]?.completedAt){ id=genExam(sj); S.exams[sj]=id; }
  S.screen="floor"; S.free=id; setSec(sj,"rank"); save(); render(true); window.scrollTo(0,0); }
function gradeExam(){
  const doc=getDoc(activeDocId), ds=docState(activeDocId); if(!allSubmitted(doc,ds)) return;
  const sj=doc.subject, n=doc.qs.length, ok=doc.qs.filter((_,i)=>ds.answers[i]?.correct).length, need=Math.ceil(n*CONFIG.examPass), pass=ok>=need;
  ds.completedAt=Date.now(); ds.exam={ok,n,need,pass};
  doc.qs.forEach((q,i)=>{ const a=ds.answers[i]; if(a&&!a.correct) S.wrongLog.push({docId:doc.id, qi:i, resp:a.resp, at:Date.now(), from:"exam"}); }); S.examLog=(S.examLog||[]).concat([{subj:sj,from:doc.fromG,to:doc.toG,ok,n,pass,at:Date.now()}]);
  save(); render(false); beep(pass);
  const G=GRADES[doc.fromG], N=GRADES[doc.toG], D=DEPTS[sj];
  showModal(pass?`<div class="nt-h">승진 시험 합격 통지</div><p class="nt-to">${esc(D.floor)} ${esc(D.name)} · ${esc(companyRank())} ${esc(S.name||"신입사원")}</p>
      <div class="nt-rank"><small>승진 발령(안)</small><b>${esc(G.name)} → ${esc(N.name)}</b><span>${ok}/${n} 정답 · 합격 기준 ${need}</span></div>
      <p class="nt-meta">${esc(N.school)} 수준 업무를 1호봉부터 맡게 됩니다.</p>
      <button class="btn primary" style="width:100%" data-act="promo-yes">승진 발령 수락</button>
      <div class="actions" style="margin-top:8px"><button class="btn" data-act="promo-no" style="width:100%">${esc(G.name)}에서 더 하기 (나중에 다시 응시)</button></div>`
    :`<div class="nt-h">승진 시험 결과 통지</div><p class="nt-to">${esc(D.floor)} ${esc(D.name)} · ${esc(S.name||"신입사원")}</p>
      <div class="nt-rank"><small>${esc(G.name)} → ${esc(N.name)}</small><b>불합격</b><span>${ok}/${n} 정답 · 합격 기준 ${need}</span></div>
      
      <button class="btn primary" style="width:100%" data-act="close-modal">확인</button>`);
}
function examReport(doc,ds){
  const e=ds.exam||{ok:0,n:doc.qs.length,need:0,pass:false};
  return `<section class="report" aria-label="시험 결과"><h3>승진 시험 결과 · ${esc(doc.no)}</h3>
    <div class="kv"><div><b class="num">${e.ok}/${e.n}</b><span>정답</span></div><div><b class="num">${e.need}</b><span>합격 기준</span></div><div><b>${e.pass?"합격":"불합격"}</b><span>판정</span></div></div>
    <div class="actions" style="margin-top:0"><button class="btn primary" data-act="back-regular">정규 업무로</button><button class="btn" data-act="to-concept">단원 개념 보기</button>${gradeOf(doc.subject).g<MAXG?`<button class="btn" data-act="exam">다시 응시</button>`:""}</div></section>`;
}
function showPromo(){
  const sj=S.subject, x=gradeOf(sj), D=DEPTS[sj], G=GRADES[x.g], N=GRADES[x.g+1];
  showModal(`<div class="nt-h">승진 심사 통지</div><p class="nt-to">${esc(D.floor)} ${esc(D.name)} · ${esc(companyRank())} ${esc(S.name||"신입사원")}</p>
    <div class="nt-rank"><small>승진 발령(안)</small><b>${esc(G.name)} → ${esc(N.name)}</b><span>${esc(N.school)} 수준 업무 · 1호봉부터</span></div>
    <p class="nt-meta">${esc(G.name)} 3호봉에서 호봉 실적 ${CONFIG.docsPerStep}건을 채웠습니다. 승진하시겠습니까?</p>
    <button class="btn primary" style="width:100%" data-act="promo-yes">승진 (다음 문서부터 적용)</button>
    <div class="actions" style="margin-top:8px"><button class="btn" data-act="promo-no" style="width:100%">${esc(G.name)}에서 더 하기</button></div>`);
}
function doNext(){ saveScroll(); const sj=S.subject, wb=wbOf(sj); if(S.cur[sj]&&!wb.sheets.includes(S.cur[sj])) wb.sheets.push(S.cur[sj]); S.cur[sj]=null; S.viewSheet=null; save(); render(true); window.scrollTo(0,0); }
async function doCopy(){ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast("복사했습니다."); }catch(e){ const t=$("#exp"); t.focus(); t.select(); toast("길게 눌러 직접 복사하세요."); } }
function doImport(){
  try{ const s=JSON.parse($("#imp").value); if(!s||s.v!==5||typeof s.docs!=="object") throw 0; S=s; S.screen="lift"; save(); render(true); toast("가져왔습니다."); }
  catch(e){ toast("형식이 올바르지 않습니다. 내보낸 내용을 그대로 붙여 넣으세요."); }
}
function confirmDlg(title,msg,onYes){
  const back=document.createElement("div"); back.className="dlg-back";
  back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3><p>${esc(msg)}</p>
    <div class="actions" style="margin:0"><button class="btn" id="dlg-no">취소</button><button class="btn primary" id="dlg-yes" style="background:var(--bad);border-color:var(--bad)">진행</button></div></div>`;
  document.body.appendChild(back); back.querySelector("#dlg-no").focus();
  back.addEventListener("click",ev=>{ if(ev.target.id==="dlg-yes"){ back.remove(); onYes(); } else if(ev.target.id==="dlg-no"||ev.target===back) back.remove(); });
}

/* =========================================================
   출입 게이트 — 앱을 열 때마다 한 번 태그 → 엘리베이터
   ========================================================= */
function hhmm(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function showGate(){
  const g=$("#gate");
  const todayIn = S.clock && S.clock.date===ymd(new Date()) ? S.clock.time : null;
  g.className="gate"; g.hidden=false;
  g.innerHTML=`
    <div class="lobby-sign"><div class="co">개념중공업</div><small>CONCEPT HEAVY INDUSTRIES · 본사 1F 로비</small></div>
    <div class="reader-zone">
      <button class="idcard" id="idcard" aria-label="사원증을 태그해 출근하기">
        <div class="band"><span>개념중공업㈜</span><span>사원증</span></div>
        <div class="body"><div class="ph" aria-hidden="true"><svg width="44" height="56" viewBox="0 0 44 56"><circle cx="22" cy="20" r="11" fill="#9aa6b5"/><path d="M2 56c2-14 10-20 20-20s18 6 20 20z" fill="#9aa6b5"/></svg></div>
          <div><div class="nm">${esc(S.name||"신입사원")}</div><div class="rk">교육과정정비본부 · ${esc(topRank())}</div><div class="no">${esc(S.empNo)}</div></div></div>
      </button>
      <div class="reader" id="reader"><span class="led"></span>사원증 리더기</div>
      <div class="gate-msg" id="gmsg" aria-live="polite">${todayIn?`오늘 <b>${todayIn}</b> 출근 기록이 있습니다.`:`<b>사원증을 태그하세요</b>`}</div>
    </div>`;
  $("#idcard").addEventListener("click",tagIn,{once:true});
  setTimeout(()=>$("#idcard")&&$("#idcard").focus(),50);
}
function beep(ding){
  try{ const A=window.AudioContext||window.webkitAudioContext; const ctx=new A();
    const tone=(f,t0,dur)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=ding?"sine":"square"; o.frequency.value=f; g.gain.value=ding?0.08:0.05; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur); };
    if(ding){ tone(1318,0,.18); tone(1046,.16,.3); } else tone(1760,0,.09); }catch(e){}
  try{ !ding && navigator.vibrate && navigator.vibrate(40); }catch(e){}
}
function tagIn(){
  const now=new Date();
  const first = !(S.clock && S.clock.date===ymd(now));
  if(first){ S.clock={date:ymd(now), time:hhmm(now)}; S.clockLog=(S.clockLog||[]).concat([S.clock]).slice(-60); }
  S.screen="lift"; S.atFloor="1F"; save();
  beep(false);
  $("#idcard").classList.add("tagged"); $("#reader").classList.add("ok");
  $("#gmsg").innerHTML=`<b>${first?"출근 처리되었습니다":"입장합니다"} · ${S.clock.time}</b><div class="sub">엘리베이터 홀로 이동합니다</div>`;
  render(true);
  const g=$("#gate"); let done=false;
  const finish=()=>{ if(done) return; done=true; g.classList.add("out"); setTimeout(()=>{ g.hidden=true; g.innerHTML=""; },reduce?0:450); };
  setTimeout(()=>g.addEventListener("click",finish),0);
  setTimeout(finish, reduce?400:1100);
}

/* 휴대폰 뒤로 가기: 앱을 나가지 않고 건물 단면도로 */
/* 층에 들어갈 때 기록 하나를 쌓고, 뒤로 가기를 누르면 그 기록만 소비해 건물로 돌아온다(건물에서 뒤로 가기는 원래대로 나감) */
function markFloorHistory(){ try{ if(S.screen!=="lift" && !(history.state&&history.state.inFloor)) history.pushState({inFloor:1},""); }catch(e){} }
window.addEventListener("popstate",()=>{ closeModal(); if(S.screen!=="lift"){ saveScroll(); S.screen="lift"; save(); render(true); } });
/* 시작 */
if(!S.empNo){ S.empNo="GN-"+String(new Date().getFullYear()).slice(2)+String(new Date().getMonth()+1).padStart(2,"0")+"-"+String(Math.floor(1000+Math.random()*9000)); save(); }
S.screen="lift"; S.lit=null; S.wb={}; S.viewSheet=null;
try{ Object.keys(S.pl||{}).forEach(sj=>archivePlacementWrong(sj)); }catch(e){}
/* 지난 기록으로 개념 익힘 상태를 한 번 채움 */
try{ if(!S.learnBuilt){ S.learn={}; Object.keys(S.docs||{}).forEach(id=>{ const d=getDoc(id), ds=S.docs[id]; if(!d||!d.qs||d.archived||d.review) return;
    d.qs.forEach((q,i)=>{ const a=ds.answers&&ds.answers[i]; if(a) noteLearn(d.subject,q,!!a.firstCorrect); }); }); S.learnBuilt=true; save(); } }catch(e){}
render(true);
showGate();
</script>
